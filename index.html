<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Namo Steels — Sales Ledger</title>
<meta name="theme-color" content="#1c1b19">
<meta name="description" content="Sales ledger for Namo Steels — party balances, bills and receivables">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Namo Ledger">
</head>
<body>
<style>
  :root{
    --bg:#1c1b19;
    --surface:#242220;
    --surface-2:#2d2a26;
    --line:#3c3833;
    --text:#ece7dd;
    --muted:#a39c8f;
    --copper:#c2793f;
    --copper-dim:#8f5b32;
    --green:#7a9b74;
    --red:#bd5b4a;
    --font-head:Georgia, 'Times New Roman', serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  #app{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  header.top{margin-bottom:18px; display:flex; justify-content:space-between; align-items:flex-start;}
  header.top h1{font-family:var(--font-head); font-weight:600; font-size:22px; letter-spacing:0.2px;}
  header.top p{color:var(--muted); font-size:12.5px; margin-top:2px;}
  header.top a.switch{color:var(--copper); font-size:12.5px; text-decoration:none; white-space:nowrap; margin-top:4px;}
  header.top a.switch:hover{text-decoration:underline;}

  nav.tabs{display:flex; border-bottom:1px solid var(--line); margin-bottom:20px;}
  nav.tabs button{
    background:none; border:none; color:var(--muted); font-family:var(--font-body);
    font-size:13.5px; font-weight:500; padding:10px 14px 10px 0; margin-right:14px;
    cursor:pointer; border-bottom:2px solid transparent; position:relative; top:1px;
  }
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--copper);}

  .stat-row{display:flex; gap:10px; margin-bottom:22px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); padding:14px 14px 12px;}
  .stat .label{color:var(--muted); font-size:11.5px; text-transform:none;}
  .stat .value{font-family:var(--font-head); font-size:22px; font-variant-numeric:tabular-nums; margin-top:4px;}
  .stat.warn .value{color:var(--red);}

  .section-title{font-family:var(--font-head); font-size:15px; font-weight:600; margin:22px 0 10px; color:var(--text);}
  .section-title:first-child{margin-top:0;}

  .row-list{border-top:1px solid var(--line);}
  .row-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .row-item:hover{background:var(--surface);}
  .row-item .name{font-weight:500;}
  .row-item .sub{color:var(--muted); font-size:12px; margin-top:1px;}
  .row-item .amt{font-variant-numeric:tabular-nums; font-weight:600;}
  .amt.pos{color:var(--copper);}
  .amt.zero{color:var(--muted); font-weight:400;}
  .amt.neg{color:var(--green);}

  .empty{color:var(--muted); font-size:13px; padding:16px 2px; font-style:normal;}

  form.panel{background:var(--surface); border:1px solid var(--line); padding:14px; margin-bottom:20px;}
  form.panel .field{margin-bottom:10px;}
  form.panel label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  form.panel input, form.panel select, form.panel textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:8px 9px; font-family:var(--font-body); font-size:13.5px; font-variant-numeric:tabular-nums;
  }
  form.panel input:focus, form.panel select:focus, form.panel textarea:focus{outline:1px solid var(--copper);}
  form.panel input[type=checkbox]{width:auto; accent-color:var(--copper);}
  .calc-block{background:var(--surface-2); border:1px solid var(--line); padding:10px 12px; margin:10px 0;}
  .calc-line{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); padding:3px 0; font-variant-numeric:tabular-nums;}
  .calc-line.sub{padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:2px;}
  .calc-line.net{border-top:1px solid var(--line); margin-top:6px; padding-top:8px; color:var(--text); font-weight:600; font-size:14px;}
  .tick-row{display:flex; align-items:center; gap:10px; padding:8px 0 2px;}
  .tick-row .tick-label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text); flex-shrink:0; width:64px;}
  .tick-row input[type=number]{width:110px; padding:6px 8px;}
  .tick-row input[type=number]:disabled{opacity:0.4;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  button.primary{
    background:var(--copper); color:#1c1b19; border:none; padding:9px 16px;
    font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:2px;
  }
  button.primary:disabled{opacity:0.5; cursor:default;}
  button.ghost{
    background:none; border:1px solid var(--line); color:var(--muted); padding:8px 14px;
    font-size:12.5px; cursor:pointer; font-family:var(--font-body);
  }

  .detail{background:var(--surface); border:1px solid var(--copper-dim); padding:14px; margin:-1px 0 14px;}
  .detail-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .detail-head h3{font-family:var(--font-head); font-size:16px;}
  .detail-head .bal{font-variant-numeric:tabular-nums; font-weight:600;}
  .ledger-line{display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ledger-line .l-date{color:var(--muted); width:60px; flex-shrink:0;}
  .ledger-line .l-desc{flex:1;}
  .ledger-line .l-amt{font-variant-numeric:tabular-nums; text-align:right; width:76px;}
  .ledger-line .l-run{font-variant-numeric:tabular-nums; text-align:right; width:76px; color:var(--muted);}
  .line-del{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 0 2px 10px; flex-shrink:0; width:26px; text-align:right;}
  .line-del:hover{color:var(--red);}
  .line-del-spacer{display:inline-block; width:26px; flex-shrink:0;}
  .quick-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .thumb{width:34px; height:34px; object-fit:cover; border:1px solid var(--line); margin-right:8px; flex-shrink:0;}
  .loading{color:var(--muted); padding:20px 2px; font-size:13px;}
  .form-sub{font-family:var(--font-head); font-size:14px; margin-bottom:10px;}
  .obadge{display:inline-block; font-size:11px; padding:2px 8px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; border-radius:10px; font-family:var(--font-body); font-weight:500;}
  .obadge.inc{color:var(--copper); border-color:var(--copper-dim); margin-left:4px;}
  .obadge.st-open{color:var(--copper); border-color:var(--copper-dim);}
  .obadge.st-partdelivered{color:#d9b25f; border-color:#8d7435;}
  .obadge.st-completed{color:var(--green); border-color:#55704f;}
  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:12px; padding:6px 12px; border-radius:14px; cursor:pointer; font-family:var(--font-body);}
  .chip.chip-active{background:var(--copper); color:#1c1b19; border-color:var(--copper);}
  .order-search{width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:9px 10px; font-size:13.5px; margin-bottom:10px; font-family:var(--font-body);}
  .order-search:focus{outline:1px solid var(--copper);}
  .dlv{display:flex; justify-content:space-between; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .dlv-date{color:var(--muted); font-size:12px; margin-left:6px;}
  .dlv-sub{color:var(--muted); font-size:12px; margin-top:2px;}
  details.done-group{margin-top:18px; border:1px solid var(--line); background:var(--surface);}
  details.done-group > summary{cursor:pointer; padding:10px 12px; font-family:var(--font-head); font-size:13.5px; color:var(--green); list-style:none;}
  details.done-group > summary::-webkit-details-marker{display:none;}
  details.done-group > summary::before{content:'▸'; display:inline-block; width:14px;}
  details.done-group[open] > summary::before{content:'▾';}
  details.done-group .row-list{padding:0 10px;}
  .count{display:inline-block; min-width:18px; text-align:center; font-size:11px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:0 6px; margin-left:4px;}
</style>

<div id="app"><div class="loading">Loading ledger…</div></div>

<script>
(function(){
  const app = document.getElementById('app');
  let state = { parties: [], bills: [], payments: [], adjustments: [], orders: [], orderOpen: null, orderEditing: null, orderFilter: [], orderSearch: '', completedOpen: false, tab: 'dashboard', openParty: null, loaded:false, loadError:null, needsAuth:false, authError:null };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){ return '₹' + Math.round(n).toLocaleString('en-IN'); }
  function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }

  // --- Storage: shared Google Sheet via Apps Script Web App ---
  // Paste your deployed Apps Script Web App URL between the quotes below.
  const API_URL = 'https://script.google.com/macros/s/AKfycbzmE1K9fLiZm4yKCXL6FxTdhOssyvqbYUk9f64WxOHoRsAfq2nNdZkOC6vkeCtVxnxw/exec';
  const PW_KEY = 'NAMO_LEDGER_PW';
  let currentPw = localStorage.getItem(PW_KEY) || '';

  async function apiGetAll(prefix){
    const res = await fetch(API_URL + '?action=getAll&prefix=' + encodeURIComponent(prefix) + '&pw=' + encodeURIComponent(currentPw));
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  async function apiSet(key, value){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'set', key, value, pw: currentPw })
    });
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  async function apiDelete(key){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'delete', key, pw: currentPw })
    });
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }

  async function loadAll(){
    if(!API_URL || API_URL.indexOf('PASTE_YOUR') === 0){
      state.loadError = 'This app isn\'t connected to shared storage yet. Deploy the Apps Script backend and paste its URL into API_URL near the top of the file.';
      state.loaded = true; render(); return;
    }
    if(!currentPw){
      state.needsAuth = true; state.loaded = true; render(); return;
    }
    try{
      const [partyMap, billMap, paymentMap, adjMap, orderMap] = await Promise.all([
        apiGetAll('party:'), apiGetAll('bill:'), apiGetAll('payment:'), apiGetAll('adjustment:'), apiGetAll('order:')
      ]);
      state.orders = Object.values(orderMap).map(v=>JSON.parse(v));
      state.parties = Object.values(partyMap).map(v=>JSON.parse(v));
      state.bills = Object.values(billMap).map(v=>JSON.parse(v));
      state.payments = Object.values(paymentMap).map(v=>JSON.parse(v));
      state.adjustments = Object.values(adjMap).map(v=>JSON.parse(v));
      state.loadError = null;
      state.needsAuth = false;
      state.authError = null;
    }catch(e){
      console.error('load error', e);
      if(e.code==='unauthorized'){
        localStorage.removeItem(PW_KEY);
        currentPw = '';
        state.needsAuth = true;
        state.authError = 'Incorrect password.';
      } else {
        state.loadError = (e && e.message) ? e.message : String(e);
      }
    }
    state.loaded = true;
    render();
  }

  async function tryPassword(pw){
    currentPw = pw;
    state.authError = null;
    await loadAll();
    if(!state.needsAuth){
      localStorage.setItem(PW_KEY, pw);
    }
  }

  function partyBalance(partyId){
    const p = state.parties.find(x=>x.id===partyId);
    let bal = p ? (Number(p.openingBalance)||0) : 0;
    state.bills.filter(b=>b.partyId===partyId).forEach(b=> bal += Number(b.amount)||0);
    state.payments.filter(pm=>pm.partyId===partyId).forEach(pm=> bal -= Number(pm.amount)||0);
    state.adjustments.filter(a=>a.partyId===partyId).forEach(a=> bal += Number(a.amount)||0);
    return bal;
  }
  function totalReceivables(){
    return state.parties.reduce((sum,p)=> sum + Math.max(0, partyBalance(p.id)), 0);
  }
  function overdueInfo(){
    const today = new Date().toISOString().slice(0,10);
    const overdueBills = state.bills.filter(b=> b.dueDate && b.dueDate < today);
    const partyIds = new Set();
    let amt = 0;
    overdueBills.forEach(b=>{ if(partyBalance(b.partyId) > 0){ amt += Number(b.amount)||0; partyIds.add(b.partyId);} });
    return { count: partyIds.size, amt };
  }

  async function saveParty(data){
    await apiSet('party:'+data.id, JSON.stringify(data));
    state.parties.push(data);
  }
  async function saveBill(data){
    await apiSet('bill:'+data.id, JSON.stringify(data));
    state.bills.push(data);
  }
  async function savePayment(data){
    await apiSet('payment:'+data.id, JSON.stringify(data));
    state.payments.push(data);
  }
  async function saveOrder(data){
    await apiSet('order:'+data.id, JSON.stringify(data));
    const i = state.orders.findIndex(o=>o.id===data.id);
    if(i>=0) state.orders[i] = data; else state.orders.push(data);
  }
  async function deleteOrder(id){
    await apiDelete('order:'+id);
    state.orders = state.orders.filter(o=>o.id!==id);
  }
  function orderStatus(o){
    if(o.completed) return 'Completed';
    if((o.deliveries||[]).length) return 'Part delivered';
    return 'Open';
  }
  async function deleteBill(id){
    await apiDelete('bill:'+id);
    state.bills = state.bills.filter(b=>b.id!==id);
  }
  async function deletePayment(id){
    await apiDelete('payment:'+id);
    state.payments = state.payments.filter(p=>p.id!==id);
  }
  async function deleteAdjustment(id){
    await apiDelete('adjustment:'+id);
    state.adjustments = state.adjustments.filter(a=>a.id!==id);
  }
  async function settleParty(partyId){
    const bal = partyBalance(partyId);
    if(Math.round(bal)===0) return;
    const data = { id: uid(), partyId, date: today(), amount: -bal, note: 'Balance settled to zero' };
    await apiSet('adjustment:'+data.id, JSON.stringify(data));
    state.adjustments.push(data);
  }

  function exportBackup(){
    const payload = { exportedAt: new Date().toISOString(), parties: state.parties, bills: state.bills, payments: state.payments, adjustments: state.adjustments, orders: state.orders };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'namo-ledger-backup-'+today()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function importBackup(file){
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const payload = JSON.parse(e.target.result);
        const jobs = [];
        (payload.parties||[]).forEach(p=> jobs.push(apiSet('party:'+p.id, JSON.stringify(p))));
        (payload.bills||[]).forEach(b=> jobs.push(apiSet('bill:'+b.id, JSON.stringify(b))));
        (payload.payments||[]).forEach(pm=> jobs.push(apiSet('payment:'+pm.id, JSON.stringify(pm))));
        (payload.adjustments||[]).forEach(a=> jobs.push(apiSet('adjustment:'+a.id, JSON.stringify(a))));
        (payload.orders||[]).forEach(o=> jobs.push(apiSet('order:'+o.id, JSON.stringify(o))));
        await Promise.all(jobs);
        loadAll();
      }catch(err){ alert('Could not read that backup file.'); }
    };
    reader.readAsText(file);
  }

  function resizeImage(file, cb){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxW = 900;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width*scale; canvas.height = img.height*scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        cb(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function setTab(t){ state.tab = t; state.openParty = null; render(); }

  function renderLockScreen(){
    let html = '<div style="max-width:320px;margin:60px auto 0;text-align:center;">';
    html += '<h1 style="font-family:var(--font-head);font-size:20px;margin-bottom:6px;">Namo Steels — Sales Ledger</h1>';
    html += '<p style="color:var(--muted);font-size:12.5px;margin-bottom:24px;">Enter the shared password to continue</p>';
    html += '<form class="panel" id="lock-form" style="text-align:left;">';
    if(state.authError) html += '<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(state.authError)+'</div>';
    html += '<div class="field"><label>Password</label><input name="pw" type="password" autofocus required></div>';
    html += '<button class="primary" type="submit" style="width:100%;">Unlock</button>';
    html += '</form></div>';
    return html;
  }

  function render(){
    if(!state.loaded){ app.innerHTML = '<div class="loading">Loading ledger…</div>'; return; }
    if(state.needsAuth){
      app.innerHTML = renderLockScreen();
      const lf = document.getElementById('lock-form');
      if(lf) lf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const pw = new FormData(lf).get('pw');
        const btn = lf.querySelector('button'); btn.disabled = true; btn.textContent = 'Checking…';
        await tryPassword(pw);
      });
      return;
    }
    const parts = [];
    parts.push('<header class="top"><div><h1>Namo Steels — Sales Ledger</h1><p>Party balances, bills &amp; receivables</p></div></header>');
    if(state.loadError){
      parts.push('<div style="background:#3a2422;border:1px solid var(--red);color:#e8b4a8;padding:10px 12px;font-size:12.5px;margin-bottom:16px;">Could not read saved data: '+escapeHtml(state.loadError)+'.</div>');
    }
    parts.push('<div style="display:flex;gap:8px;margin-bottom:16px;"><button class="ghost" id="refresh-btn">Refresh</button><button class="ghost" id="export-btn">Download backup</button><label class="ghost" style="cursor:pointer;">Restore backup<input type="file" id="import-input" accept="application/json" style="display:none;"></label></div>');
    parts.push('<nav class="tabs">');
    [['dashboard','Dashboard'],['parties','Parties'],['bills','Bills'],['payments','Payments'],['orders','Order Tracker']].forEach(([k,label])=>{
      parts.push(`<button data-tab="${k}" class="${state.tab===k?'active':''}">${label}</button>`);
    });
    parts.push('</nav>');

    if(state.tab==='dashboard') parts.push(renderDashboard());
    if(state.tab==='parties') parts.push(renderParties());
    if(state.tab==='bills') parts.push(renderBills());
    if(state.tab==='payments') parts.push(renderPayments());
    if(state.tab==='orders') parts.push(renderOrders());

    app.innerHTML = parts.join('');
    bindEvents();
  }

  function renderDashboard(){
    const total = totalReceivables();
    const od = overdueInfo();
    let html = '<div class="stat-row">';
    html += `<div class="stat"><div class="label">Total receivables</div><div class="value">${money(total)}</div></div>`;
    html += `<div class="stat ${od.amt>0?'warn':''}"><div class="label">Overdue (${od.count} ${od.count===1?'party':'parties'})</div><div class="value">${money(od.amt)}</div></div>`;
    html += `<div class="stat" data-tab="orders" style="cursor:pointer;"><div class="label">Orders not completed</div><div class="value">${state.orders.filter(o=>!o.completed).length}</div></div>`;
    html += '</div>';
    html += '<div class="section-title">Outstanding by party</div>';
    const rows = state.parties.map(p=>({p, bal: partyBalance(p.id)})).sort((a,b)=>b.bal-a.bal);
    if(rows.length===0){
      html += '<div class="empty">No parties yet. Add one under the Parties tab.</div>';
    } else {
      html += '<div class="row-list">';
      rows.forEach(({p,bal})=>{
        const cls = bal>0?'pos':(bal<0?'neg':'zero');
        html += `<div class="row-item" data-open-party="${p.id}" data-goto="parties"><div><div class="name">${escapeHtml(p.name)}</div></div><div class="amt ${cls}">${money(bal)}</div></div>`;
      });
      html += '</div>';
    }
    return html;
  }

  function renderParties(){
    let html = '<form class="panel" id="party-form">';
    html += '<div class="field-row"><div class="field"><label>Party name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div></div>';
    html += '<div class="field-row"><div class="field"><label>Opening balance (₹, they owe you)</label><input name="openingBalance" type="number" step="0.01" value="0"></div><div class="field"><label>Notes</label><input name="notes"></div></div>';
    html += '<button class="primary" type="submit">Add party</button>';
    html += '</form>';

  function renderPartyDetail(p){
    const bills = state.bills.filter(b=>b.partyId===p.id);
    const payments = state.payments.filter(pm=>pm.partyId===p.id);
    const adjustments = state.adjustments.filter(a=>a.partyId===p.id);
    let lines = [];
    lines.push({date: p.createdAt || '0000-00-00', desc:'Opening balance', amt: Number(p.openingBalance)||0, type:'open'});
    bills.forEach(b=> lines.push({date:b.date, desc:'Bill '+(b.invoiceNo||''), amt:Number(b.amount)||0, type:'bill', id:b.id}));
    payments.forEach(pm=> lines.push({date:pm.date, desc:'Payment received'+(pm.mode?' ('+pm.mode+')':''), amt:-(Number(pm.amount)||0), type:'payment', id:pm.id}));
    adjustments.forEach(a=> lines.push({date:a.date, desc:a.note||'Balance adjustment', amt:Number(a.amount)||0, type:'adjustment', id:a.id}));
    lines.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
    let running = 0;
    const bal = partyBalance(p.id);
    let html = '<div class="detail">';
    html += `<div class="detail-head"><h3>${escapeHtml(p.name)}</h3><div class="bal">${money(bal)}</div></div>`;
    if(lines.length===0 || (lines.length===1 && lines[0].amt===0)){
      html += '<div class="empty">No bills or payments yet.</div>';
    } else {
      lines.forEach(l=>{
        running += l.amt;
        if(l.type==='open' && l.amt===0) return;
        const delBtn = l.type!=='open' ? `<button class="line-del" data-delete-${l.type}="${l.id}" data-party="${p.id}" title="Delete">✕</button>` : '<span class="line-del-spacer"></span>';
        html += `<div class="ledger-line"><div class="l-date">${fmtDate(l.date)}</div><div class="l-desc">${escapeHtml(l.desc)}</div><div class="l-amt">${l.amt>=0?'+':''}${money(l.amt)}</div><div class="l-run">${money(running)}</div>${delBtn}</div>`;
      });

    html += '<div class="quick-actions">';
    html += `<button class="ghost" data-goto-tab="bills" data-preset-party="${p.id}">+ Bill</button>`;
    html += `<button class="ghost" data-goto-tab="payments" data-preset-party="${p.id}">+ Payment</button>`;

      html += `<button class="ghost" data-settle-party="${p.id}">Settle to zero</button>`;
    }
    html += '</div>';
    html += '</div>';
    return html;
  }

  function orderRow(o){
    const p = state.parties.find(x=>x.id===o.partyId);
    const st = orderStatus(o);
    const bits = [];
    if(o.item) bits.push(escapeHtml(o.item));
    if(o.qty) bits.push(escapeHtml(o.qty));
    if(o.price) bits.push('@ '+escapeHtml(o.price));
    const dl = (o.deliveries||[]).length;
    let h = `<div class="row-item" data-open-order="${o.id}"><div><div class="name">${p?escapeHtml(p.name):'Unknown party'} <span class="obadge inc">${escapeHtml(o.incoterm||'')}</span></div><div class="sub">${bits.join(' · ')||'—'}</div><div class="sub">Ordered ${fmtDate(o.date)}${dl?(' · '+dl+' deliver'+(dl===1?'y':'ies')):''}</div></div><div><span class="obadge st-${st.replace(/\s/g,'').toLowerCase()}">${st}</span></div></div>`;
    if(state.orderOpen===o.id) h += orderDetail(o, p);

  }

  function orderDetail(o, p){
    const st = orderStatus(o);
    let h = '<div class="detail">';
    h += `<div class="detail-head"><h3>${p?escapeHtml(p.name):'Unknown party'}</h3><span class="obadge st-${st.replace(/\s/g,'').toLowerCase()}">${st}</span></div>`;
    const line = (k,v)=> `<div class="ledger-line"><div class="l-desc">${k}</div><div class="l-amt" style="width:auto;max-width:65%;">${v?escapeHtml(v):'—'}</div></div>`;
    h += line('Order date', o.date?fmtDate(o.date)+' '+(new Date(o.date).getFullYear()):'');
    h += line('Incoterm', (o.incoterm||'')+(o.terms?' — '+o.terms:''));
    h += line('Sold', o.item);
    h += line('Quantity', o.qty);
    h += line('Price', o.price);
    if(o.notes) h += line('Notes', o.notes);
    if(o.completed) h += line('Completed on', o.completedDate?fmtDate(o.completedDate)+' '+(new Date(o.completedDate).getFullYear()):'');

    h += '<div class="section-title" style="margin-top:18px;">Deliveries</div>';

    ds.forEach(d=>{
      h += `<div class="dlv"><div class="dlv-main"><div><b>${escapeHtml(d.qty||'Delivery')}</b> <span class="dlv-date">${fmtDate(d.date)}</span></div><div class="dlv-sub">${d.invoiceNo?('Invoice '+escapeHtml(d.invoiceNo)):'No invoice no.'}${d.invoiceDate?(' · dated '+fmtDate(d.invoiceDate)):''}${d.note?(' · '+escapeHtml(d.note)):''}</div></div><button class="line-del" data-delete-delivery="${d.id}" data-order="${o.id}" title="Delete">✕</button></div>`;
    });

    if(!o.completed){
      h += `<form class="panel" data-delivery-form="${o.id}" style="margin:12px 0 0;"><div class="form-sub">Record a delivery</div>`;
      h += `<div class="field-row"><div class="field"><label>Delivery date</label><input name="date" type="date" value="${today()}"></div><div class="field"><label>Quantity delivered</label><input name="qty" placeholder="e.g. 5 tonnes, 2 trolleys, 1 pickup"></div></div>`;
      h += `<div class="field-row"><div class="field"><label>Invoice no.</label><input name="invoiceNo" placeholder="invoice for this delivery"></div><div class="field"><label>Invoice date</label><input name="invoiceDate" type="date" value="${today()}"></div></div>`;
      h += `<div class="field"><label>Note</label><input name="note" placeholder="vehicle no., remarks…"></div>`;
      h += `<button class="primary" type="submit">Save delivery</button></form>`;
    }
    h += '<div class="quick-actions">';
    if(!o.completed) h += `<button class="ghost" data-complete-order="${o.id}">Mark order completed</button>`;
    else h += `<button class="ghost" data-reopen-order="${o.id}">Reopen order</button>`;
    h += `<button class="ghost" data-edit-order="${o.id}">Edit order</button>`;
    h += `<button class="ghost" data-delete-order="${o.id}">Delete order</button>`;
    h += '</div></div>';
    return h;
  }

    html += '<div class="field"><label>What was sold</label><input name="item" placeholder="e.g. Copper scrap, Aluminium ingots" value="'+ev('item')+'"></div>';

    html += '<div class="field"><label>Notes</label><input name="notes" placeholder="anything else" value="'+ev('notes')+'"></div>';
    html += '<div style="display:flex;gap:8px;"><button class="primary" type="submit" '+(state.parties.length?'':'disabled')+'>'+(editing?'Update order':'Save order')+'</button>';

    html += `<input type="search" id="order-search" class="order-search" placeholder="Search party, item, quantity, price or invoice no." value="${escapeHtml(state.orderSearch)}" autocomplete="off">`;
    html += '<div class="chip-row">' + ['Open','Part delivered','Completed'].map(st=>`<button type="button" class="chip ${state.orderFilter.includes(st)?'chip-active':''}" data-order-filter="${st}">${st}</button>`).join('') + '</div>';

    const q = state.orderSearch.trim().toLowerCase();
    let list = state.orders.slice();
    if(state.orderFilter.length) list = list.filter(o=>state.orderFilter.includes(orderStatus(o)));
    if(q){
      list = list.filter(o=>{
        const p = state.parties.find(x=>x.id===o.partyId);
        const hay = [p&&p.name, o.item, o.qty, o.price, o.terms, o.notes, o.incoterm].concat((o.deliveries||[]).map(d=>[d.invoiceNo,d.qty,d.note].join(' '))).join(' ').toLowerCase();
        return q.split(/\s+/).filter(Boolean).every(t=>hay.includes(t));
      });
    }
    const bySeq = (a,b)=> (b.date||'').localeCompare(a.date||'') || (b.id>a.id?1:-1);
    const active = list.filter(o=>!o.completed).sort(bySeq);
    const done = list.filter(o=>o.completed).sort(bySeq);
    if(!list.length){
      html += '<div class="empty">'+(state.orders.length?'No orders match.':'No orders yet. Record your first sale above.')+'</div>';
    } else {
      if(active.length) html += '<div class="row-list">' + active.map(orderRow).join('') + '</div>';
      if(done.length){
        const open = state.completedOpen || !!q || state.orderFilter.includes('Completed') || done.some(o=>o.id===state.orderOpen);
        html += `<details class="done-group" ${open?'open':''}><summary>Completed orders <span class="count">${done.length}</span></summary><div class="row-list">${done.map(orderRow).join('')}</div></details>`;
      }
    }
    return html;
  }

  function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function computeBillTotals(fd){
    const basic = Number(fd.get('basicAmount'))||0;
    const gstOn = fd.get('gstEnabled')==='on';
    const gst = gstOn ? basic * 0.18 : 0;
    const tcsOn = fd.get('tcsEnabled')==='on';
    const tds1On = fd.get('tds1Enabled')==='on';
    const tds2On = fd.get('tds2Enabled')==='on';
    const tcsPct = Number(fd.get('tcsPercent'))||0;
    const tds1Pct = Number(fd.get('tds1Percent'))||0;
    const tds2Pct = Number(fd.get('tds2Percent'))||0;
    const tcsAmt = tcsOn ? (basic+gst) * (tcsPct/100) : 0;
    const tds1Amt = tds1On ? basic * (tds1Pct/100) : 0;
    const tds2Amt = tds2On ? basic * (tds2Pct/100) : 0;
    const net = basic + gst + tcsAmt - tds1Amt - tds2Amt;
    return { basic, gstOn, gst, tcsOn, tcsPct, tcsAmt, tds1On, tds1Pct, tds1Amt, tds2On, tds2Pct, tds2Amt, net };
  }

  function wireBillCalc(bf){
    const refresh = ()=>{
      document.getElementById('tcs-percent').disabled = !document.getElementById('tcs-enabled').checked;
      document.getElementById('tds1-percent').disabled = !document.getElementById('tds1-enabled').checked;
      document.getElementById('tds2-percent').disabled = !document.getElementById('tds2-enabled').checked;
      const fd = new FormData(bf);
      const t = computeBillTotals(fd);
      document.getElementById('calc-basic').textContent = money(t.basic);
      document.getElementById('calc-gst').textContent = money(t.gst);
      document.getElementById('calc-tcs').textContent = (t.tcsOn?'+':'') + money(t.tcsAmt);
      document.getElementById('calc-tds1').textContent = (t.tds1On?'-':'') + money(t.tds1Amt);
      document.getElementById('calc-tds2').textContent = (t.tds2On?'-':'') + money(t.tds2Amt);
      document.getElementById('calc-net').textContent = money(t.net);
    };
    bf.addEventListener('input', refresh);
    bf.addEventListener('change', refresh);
    refresh();
  }

  function bindEvents(){
    const refreshBtn = document.getElementById('refresh-btn');
    if(refreshBtn) refreshBtn.addEventListener('click', ()=>{ refreshBtn.textContent='Refreshing…'; loadAll(); });
    const exportBtn = document.getElementById('export-btn');
    if(exportBtn) exportBtn.addEventListener('click', exportBackup);
    const importInput = document.getElementById('import-input');
    if(importInput) importInput.addEventListener('change', (e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); });
    app.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
    app.querySelectorAll('[data-open-party]').forEach(el=> el.addEventListener('click', (e)=>{
      const id = el.dataset.openParty;
      if(el.dataset.goto==='parties') { state.tab='parties'; }
      state.openParty = state.openParty===id ? null : id;
      render();
    }));
    app.querySelectorAll('[data-goto-tab]').forEach(el=> el.addEventListener('click', ()=>{
      presetParty = el.dataset.presetParty;
      state.tab = el.dataset.gotoTab;
      state.openParty = null;
      render();
    }));

    app.querySelectorAll('[data-delete-bill]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this bill? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deleteBill(el.dataset.deleteBill); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-payment]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this payment? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deletePayment(el.dataset.deletePayment); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-adjustment]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this adjustment? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deleteAdjustment(el.dataset.deleteAdjustment); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-settle-party]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const partyId = el.dataset.settleParty;
      const bal = partyBalance(partyId);
      if(!confirm('Settle this party\'s balance to zero? This adds an adjustment entry for ' + money(-bal) + '.')) return;
      el.disabled = true; el.textContent = 'Settling…';
      try{ await settleParty(partyId); render(); }
      catch(err){ console.error(err); el.disabled=false; el.textContent='Settle to zero'; alert('Could not settle — try again.'); }
    }));

    // ---- Order tracker events ----
    const osb = document.getElementById('order-search');
    if(osb) osb.addEventListener('input', ()=>{ state.orderSearch = osb.value; render(); const n=document.getElementById('order-search'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); });
    app.querySelectorAll('details.done-group').forEach(d=> d.addEventListener('toggle', ()=>{ state.completedOpen = d.open; }));
    app.querySelectorAll('[data-order-filter]').forEach(el=> el.addEventListener('click', ()=>{
      const st = el.dataset.orderFilter; const i = state.orderFilter.indexOf(st);
      if(i>=0) state.orderFilter.splice(i,1); else state.orderFilter.push(st); render();
    }));
    app.querySelectorAll('[data-open-order]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.dataset.openOrder; state.orderOpen = state.orderOpen===id?null:id; render();
    }));
    app.querySelectorAll('[data-edit-order]').forEach(el=> el.addEventListener('click', ()=>{ state.orderEditing = el.dataset.editOrder; state.orderOpen=null; render(); window.scrollTo(0,0); }));
    const ceo = document.getElementById('cancel-edit-order');
    if(ceo) ceo.addEventListener('click', ()=>{ state.orderEditing=null; render(); });
    app.querySelectorAll('[data-delete-order]').forEach(el=> el.addEventListener('click', async ()=>{
      if(!confirm('Delete this order and all its deliveries? This cannot be undone.')) return;
      el.disabled = true;
      try{ state.orderOpen=null; await deleteOrder(el.dataset.deleteOrder); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-complete-order]').forEach(el=> el.addEventListener('click', async ()=>{
      const o = state.orders.find(x=>x.id===el.dataset.completeOrder); if(!o) return;
      el.disabled = true;
      try{ await saveOrder(Object.assign({}, o, {completed:true, completedDate: today()})); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not save — try again.'); }
    }));
    app.querySelectorAll('[data-reopen-order]').forEach(el=> el.addEventListener('click', async ()=>{
      const o = state.orders.find(x=>x.id===el.dataset.reopenOrder); if(!o) return;
      el.disabled = true;
      try{ await saveOrder(Object.assign({}, o, {completed:false, completedDate:''})); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not save — try again.'); }
    }));
    app.querySelectorAll('[data-delete-delivery]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this delivery entry?')) return;
      const o = state.orders.find(x=>x.id===el.dataset.order); if(!o) return;
      el.disabled = true;
      try{ await saveOrder(Object.assign({}, o, {deliveries:(o.deliveries||[]).filter(d=>d.id!==el.dataset.deleteDelivery)})); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delivery-form]').forEach(f=> f.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const o = state.orders.find(x=>x.id===f.dataset.deliveryForm); if(!o) return;
      const fd = new FormData(f);
      const d = { id: uid(), date: fd.get('date')||today(), qty: (fd.get('qty')||'').trim(), invoiceNo: (fd.get('invoiceNo')||'').trim(), invoiceDate: fd.get('invoiceNo') ? (fd.get('invoiceDate')||'') : (fd.get('invoiceDate')||''), note: (fd.get('note')||'').trim() };
      if(!d.qty && !d.invoiceNo && !d.note){ alert('Enter the quantity delivered or an invoice no.'); return; }
      const btn = f.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
      try{ await saveOrder(Object.assign({}, o, {deliveries:(o.deliveries||[]).concat([d])})); render(); }
      catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save delivery'; alert('Could not save — try again.'); }
    }));
    const of = document.getElementById('order-form');
    if(of) of.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(of);
      const existing = state.orderEditing ? state.orders.find(o=>o.id===state.orderEditing) : null;
      const data = Object.assign({ id: uid(), deliveries: [], completed: false, completedDate: '', createdAt: today() }, existing||{}, {
        partyId: fd.get('partyId'), date: fd.get('date')||today(), incoterm: fd.get('incoterm')||'EX', terms: (fd.get('terms')||'').trim(),
        item: (fd.get('item')||'').trim(), qty: (fd.get('qty')||'').trim(), price: (fd.get('price')||'').trim(), notes: (fd.get('notes')||'').trim()
      });
      if(!data.partyId){ alert('Please select a party.'); return; }
      const btn = of.querySelector('button.primary'); btn.disabled = true; btn.textContent='Saving…';
      try{ await saveOrder(data); state.orderEditing=null; render(); }
      catch(err){ console.error(err); btn.disabled=false; btn.textContent=existing?'Update order':'Save order'; alert('Could not save — try again.'); }
    });

    const pf = document.getElementById('party-form');
    if(pf) pf.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(pf);
      const data = { id: uid(), name: fd.get('name').trim(), phone: fd.get('phone').trim(), openingBalance: Number(fd.get('openingBalance'))||0, notes: fd.get('notes').trim(), createdAt: today() };
      if(!data.name) return;
      const btn = pf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
      try{ await saveParty(data); render(); }
      catch(err){ console.error(err); btn.disabled=false; btn.textContent='Add party'; alert('Could not save party — try again.'); }
    });

    const bf = document.getElementById('bill-form');
    if(bf){
      wireBillCalc(bf);
      bf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(bf);
        const file = fd.get('image');
        const t = computeBillTotals(fd);
        const build = (imageData)=> ({
          id: uid(), partyId: fd.get('partyId'), invoiceNo: (fd.get('invoiceNo')||'').trim(),
          basicAmount: t.basic, gstAmount: t.gst,
          tcsPercent: t.tcsOn ? t.tcsPct : null, tcsAmount: t.tcsAmt,
          tds1Percent: t.tds1On ? t.tds1Pct : null, tds1Amount: t.tds1Amt,
          tds2Percent: t.tds2On ? t.tds2Pct : null, tds2Amount: t.tds2Amt,
          amount: t.net,
          date: fd.get('date')||today(), dueDate: fd.get('dueDate')||'', image: imageData||null
        });
        const btn = bf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        const finish = async (data)=>{
          try{ await saveBill(data); render(); }
          catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save bill'; alert('Could not save bill — try again.'); }
        };
        if(file && file.size>0){
          resizeImage(file, (dataUrl)=> finish(build(dataUrl)));
        } else {
          finish(build(null));
        }
      });
    }

    const pmf = document.getElementById('payment-form');
    if(pmf) pmf.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(pmf);
      const data = { id: uid(), partyId: fd.get('partyId'), amount: Number(fd.get('amount'))||0, date: fd.get('date')||today(), mode: fd.get('mode'), note: (fd.get('note')||'').trim() };
      const btn = pmf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
      try{ await savePayment(data); render(); }
      catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save payment'; alert('Could not save payment — try again.'); }
    });
  }

  // Safety net: never leave the user stuck on the loading screen.
  setTimeout(()=>{ if(!state.loaded){ state.loaded = true; state.loadError = 'Timed out reaching shared storage — check your internet connection and try Refresh.'; render(); } }, 8000);

  loadAll();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
