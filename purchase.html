<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Namo Steels — Purchase Ledger</title>
<meta name="theme-color" content="#d7dcc6">
<meta name="description" content="Purchase ledger for Namo Steels — containers, hisaab accounts and supplier balances">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Namo Purchase">
</head>
<body>
<style>
  :root{
    --desk:#d7dcc6; --bg:#eef0e9; --surface:#e3e7da; --surface-2:#d7dccb; --line:#c0c8b1;
    --text:#273530; --muted:#69776a;
    --accent:#3f6b57; --accent-dim:#5c8470;
    --rust:#a85a2a;
    --red:#9c4330;
    --font-head:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--desk);}
  body{ background:var(--desk); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
  #app{max-width:640px; margin:0 auto; padding:0 0 48px;}
  .sheet{
    background:var(--bg); border:1px solid var(--line); border-left:5px solid var(--accent-dim);
    border-radius:2px 10px 10px 2px; box-shadow:0 10px 28px rgba(39,53,48,0.14), 0 2px 6px rgba(39,53,48,0.08);
    margin:22px 10px 0; padding:22px 18px 26px;
  }
  header.top{margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  header.top h1{font-family:var(--font-head); font-weight:600; font-size:22px; letter-spacing:0.1px; color:var(--text);}
  header.top p{color:var(--muted); font-size:12.5px; margin-top:2px; font-style:italic;}

  nav.tabs{display:flex; gap:5px; margin-bottom:20px; flex-wrap:wrap;}
  nav.tabs button{
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
    border-bottom:2px solid var(--accent-dim); font-family:var(--font-head); font-weight:600;
    font-size:12.5px; padding:8px 12px; cursor:pointer; border-radius:6px 6px 0 0;
    position:relative; top:1px; transition:background 0.15s ease, color 0.15s ease;
  }
  nav.tabs button:hover:not(.active){background:var(--line); color:var(--text);}
  nav.tabs button.active{ background:var(--bg); color:var(--accent-dim); border-color:var(--accent-dim); border-bottom-color:var(--bg); top:0; }

  .stat-row{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
  .stat{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--line); padding:12px 13px 11px;}
  .stat .label{color:var(--muted); font-size:11px;}
  .stat .value{font-family:var(--font-head); font-size:19px; font-variant-numeric:tabular-nums; margin-top:3px;}

  .section-title{font-family:var(--font-head); font-size:15px; font-weight:600; margin:22px 0 10px; color:var(--text);}
  .section-title:first-child{margin-top:0;}

  .row-list{border-top:1px solid var(--line);}
  .row-item{ display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row-item:hover{background:var(--surface);}
  .row-item .name{font-weight:500;}
  .row-item .sub{color:var(--muted); font-size:12px; margin-top:1px;}
  .row-item .amt{font-variant-numeric:tabular-nums; font-weight:600;}
  .amt.pos{color:var(--rust);} .amt.zero{color:var(--muted); font-weight:400;} .amt.neg{color:var(--accent);}

  .empty{color:var(--muted); font-size:13px; padding:16px 2px;}

  form.panel{background:var(--surface); border:1px solid var(--line); padding:14px; margin-bottom:20px;}
  form.panel .field{margin-bottom:10px;}
  form.panel label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  form.panel input, form.panel select, form.panel textarea{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:8px 9px; font-family:var(--font-body); font-size:13.5px; font-variant-numeric:tabular-nums; }
  form.panel input[type=checkbox]{width:auto; accent-color:var(--accent);}
  form.panel textarea{font-variant-numeric:normal; resize:vertical; min-height:46px;}
  form.panel input:focus, form.panel select:focus, form.panel textarea:focus{outline:1px solid var(--accent);}
  .field-row{display:flex; gap:10px;} .field-row .field{flex:1;}
  .field-row3{display:flex; gap:8px;} .field-row3 .field{flex:1;}
  .check-row{display:flex; gap:18px; margin-bottom:10px;}
  .check-row label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text);}
  button.primary{ background:var(--accent); color:#f4f6ef; border:none; padding:9px 16px; font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:2px; transition:background 0.15s ease; }
  button.primary:hover:not(:disabled){background:var(--accent-dim);}
  button.primary:disabled{opacity:0.5; cursor:default;}
  button.ghost{ background:none; border:1px solid var(--line); color:var(--muted); padding:8px 14px; font-size:12.5px; cursor:pointer; font-family:var(--font-body); }
  .form-sub-title{font-family:var(--font-head); font-size:14px; margin-bottom:10px; color:var(--text);}

  .calc-block{background:var(--surface-2); border:1px solid var(--line); padding:10px 12px; margin:10px 0;}
  .calc-line{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); padding:3px 0; font-variant-numeric:tabular-nums;}
  .calc-line.net{border-top:1px solid var(--line); margin-top:6px; padding-top:8px; color:var(--text); font-weight:600; font-size:14px;}

  .voucher{background:var(--surface); border:1px solid var(--accent-dim); padding:14px; margin:-1px 0 14px; box-shadow:0 1px 3px rgba(39,53,48,0.06);}
  .voucher-head{display:flex; justify-content:space-between; font-family:var(--font-head); font-size:15px; margin-bottom:10px;}
  .voucher-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .voucher-row .vr-label{color:var(--muted);}
  .voucher-row .vr-val{font-variant-numeric:tabular-nums; text-align:right;}
  .voucher-row.net{font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:9px; border-bottom:none;}
  .voucher-note{font-size:12px; color:var(--muted); font-style:italic; margin-top:6px;}
  .seq{color:var(--muted); font-family:var(--font-head); font-size:12px;}
  .badge{display:inline-block; font-size:11px; padding:2px 7px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;}
  .badge-loaded{border-color:var(--rust); color:var(--rust);}
  .badge-pending{border-color:var(--red); color:var(--red);}
  .badge-arrived{border-color:var(--accent); color:var(--accent);}
  .hisaab-tag{font-size:11px; color:var(--rust); margin-left:6px;}
  .hisaab-tag.none{color:var(--muted);}
  .line-del{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 0 2px 10px; flex-shrink:0;}
  .line-del:hover{color:var(--red);}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:11.5px; padding:6px 11px; border-radius:14px; cursor:pointer; font-family:var(--font-body);}
  .chip.chip-active{background:var(--accent); color:#f4f6ef; border-color:var(--accent);}

  .detail{background:var(--surface); border:1px solid var(--accent-dim); padding:14px; margin:-1px 0 14px; box-shadow:0 1px 3px rgba(39,53,48,0.06);}
  .detail-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .detail-head h3{font-family:var(--font-head); font-size:16px;}
  .balance-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 14px;}
  .balance-grid .b-item{background:var(--surface-2); border:1px solid var(--line); padding:9px 10px;}
  .balance-grid .b-item .b-label{font-size:10.5px; color:var(--muted);}
  .balance-grid .b-item .b-val{font-family:var(--font-head); font-size:16px; font-variant-numeric:tabular-nums; margin-top:2px;}
  .ledger-line{display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ledger-line .l-date{color:var(--muted); width:58px; flex-shrink:0;}
  .ledger-line .l-desc{flex:1;}
  .ledger-line .l-amt{font-variant-numeric:tabular-nums; text-align:right; width:80px;}
  .quick-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .loading{color:var(--muted); padding:20px 2px; font-size:13px;}
  .inline-check{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text);}
  .inline-check input{accent-color:var(--accent);}
</style>

<div id="app"><div class="loading">Loading ledger…</div></div>

<script>
(function(){
  const app = document.getElementById('app');
  const STATUS_ORDER = ['Arrived', 'Arrived — Payment Pending', 'Loaded', 'Booked'];

  let state = {
    containers: [], hisaabs: [], payments: [], suppliers: [], claims: [],
    tab: 'containers', openContainer: null, openHisaab: null,
    editingContainerId: null,
    activePartyId: null, partySubTab: 'containers',
    allContractsFilter: [], partyContainerFilter: [],
    loaded:false, loadError:null, needsAuth:false, authError:null
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function num(n){ return (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function money(n){ return '₹' + Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  const API_URL = 'https://script.google.com/macros/s/AKfycbzODOIf1Imymd9LR2Hu9NQ-LrGmcVoT-TVEdOyS-dXLYjU1efcNjJSL09aESkGRs2_7nA/exec';
  const PW_KEY = 'NAMO_PURCHASE_PW';
  let currentPw = localStorage.getItem(PW_KEY) || '';

  async function apiGetAll(prefix){
    const res = await fetch(API_URL + '?action=getAll&prefix=' + encodeURIComponent(prefix) + '&pw=' + encodeURIComponent(currentPw));
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  async function apiSet(key, value){
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'set', key, value, pw: currentPw }) });
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  async function apiDelete(key){
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'delete', key, pw: currentPw }) });
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }

  async function loadAll(){
    if(!currentPw){ state.needsAuth = true; state.loaded = true; render(); return; }
    try{
      const [containerMap, hisaabMap, paymentMap, supplierMap, claimMap] = await Promise.all([
        apiGetAll('container:'), apiGetAll('hisaab:'), apiGetAll('payment:'), apiGetAll('supplier:'), apiGetAll('claim:')
      ]);
      state.containers = Object.values(containerMap).map(v=>JSON.parse(v));
      state.hisaabs = Object.values(hisaabMap).map(v=>JSON.parse(v));
      state.payments = Object.values(paymentMap).map(v=>JSON.parse(v));
      state.suppliers = Object.values(supplierMap).map(v=>JSON.parse(v));
      state.claims = Object.values(claimMap).map(v=>JSON.parse(v));
      state.loadError = null; state.needsAuth = false; state.authError = null;
    }catch(e){
      console.error('load error', e);
      if(e.code==='unauthorized'){
        localStorage.removeItem(PW_KEY); currentPw = '';
        state.needsAuth = true; state.authError = 'Incorrect password.';
      } else { state.loadError = (e && e.message) ? e.message : String(e); }
    }
    state.loaded = true;
    render();
  }

  async function tryPassword(pw){
    currentPw = pw; state.authError = null;
    await loadAll();
    if(!state.needsAuth) localStorage.setItem(PW_KEY, pw);
  }

  function nextContainerSeq(){ return state.containers.reduce((m,c)=> Math.max(m, Number(c.seq)||0), 0) + 1; }
  function nextHisaabSeq(){ return state.hisaabs.reduce((m,h)=> Math.max(m, Number(h.seq)||0), 0) + 1; }
  function generateOrderNo(seq, dateStr){
    const year = (dateStr ? new Date(dateStr) : new Date()).getFullYear();
    return 'NS' + String(seq).padStart(4,'0') + year;
  }

  // ---- Container status: fully automatic, derived from the data itself ----
  function containerHisaab(c){ return state.hisaabs.find(h=>h.containerId===c.id) || null; }
  function containerPaid(c){ return state.payments.filter(p=>p.containerId===c.id).reduce((s,p)=> s+(Number(p.amount)||0), 0); }
  function containerBalance(c){
    const h = containerHisaab(c);
    if(!h) return null;
    return (Number(h.netPayable)||0) - containerPaid(c);
  }
  function computeContainerStatus(c){
    const h = containerHisaab(c);
    if(h){
      const bal = containerBalance(c);
      return (bal!==null && bal<=0.01) ? 'Arrived' : 'Arrived — Payment Pending';
    }
    if(c.contNo || c.weight) return 'Loaded';
    return 'Booked';
  }
  function statusBadgeClass(status){
    if(status==='Arrived') return 'badge badge-arrived';
    if(status==='Arrived — Payment Pending') return 'badge badge-pending';
    if(status==='Loaded') return 'badge badge-loaded';
    return 'badge';
  }

  // ---- Balances ----
  function supplierContainerBalance(partyId){
    return state.hisaabs.filter(h=>h.partyId===partyId).reduce((s,h)=> s + (Number(h.netPayable)||0), 0);
  }
  function supplierAdvanceBalance(partyId){
    return state.hisaabs.filter(h=>h.partyId===partyId).reduce((s,h)=> s + (Number(h.advance)||0), 0);
  }
  function supplierClaimBalance(partyId){
    return state.claims.filter(cl=>cl.partyId===partyId).reduce((s,cl)=> s + (Number(cl.amount)||0), 0);
  }
  function supplierPayments(partyId){
    return state.payments.filter(p=>p.partyId===partyId).reduce((s,p)=> s + (Number(p.amount)||0), 0);
  }
  function supplierNetBalance(partyId){
    // Claims are tracked separately (they can take years to resolve) and are
    // deliberately NOT netted into what's currently owed.
    return supplierContainerBalance(partyId) - supplierPayments(partyId);
  }
  function totalPayable(){
    return state.suppliers.reduce((s,sup)=> s + Math.max(0, supplierNetBalance(sup.id)), 0);
  }

  async function saveContainer(data){
    await apiSet('container:'+data.id, JSON.stringify(data));
    const idx = state.containers.findIndex(c=>c.id===data.id);
    if(idx>=0) state.containers[idx] = data; else state.containers.push(data);
  }
  async function saveHisaab(data){
    await apiSet('hisaab:'+data.id, JSON.stringify(data));
    state.hisaabs.push(data);
    if(data.containerId){
      const c = state.containers.find(x=>x.id===data.containerId);
      if(c){ c.hisaabSeq = data.seq; await apiSet('container:'+c.id, JSON.stringify(c)); }
    }
  }
  async function savePayment(data){ await apiSet('payment:'+data.id, JSON.stringify(data)); state.payments.push(data); }
  async function saveSupplier(data){ await apiSet('supplier:'+data.id, JSON.stringify(data)); state.suppliers.push(data); }
  async function saveClaim(data){ await apiSet('claim:'+data.id, JSON.stringify(data)); state.claims.push(data); }

  async function deleteContainer(id){ await apiDelete('container:'+id); state.containers = state.containers.filter(c=>c.id!==id); }
  async function deleteHisaab(id){ await apiDelete('hisaab:'+id); state.hisaabs = state.hisaabs.filter(h=>h.id!==id); }
  async function deletePayment(id){ await apiDelete('payment:'+id); state.payments = state.payments.filter(p=>p.id!==id); }
  async function deleteClaim(id){ await apiDelete('claim:'+id); state.claims = state.claims.filter(c=>c.id!==id); }

  async function toggleContainerFlag(id, field){
    const c = state.containers.find(x=>x.id===id); if(!c) return;
    c[field] = !c[field];
    await apiSet('container:'+id, JSON.stringify(c));
    render();
  }

  function setTab(t){ state.tab = t; state.openContainer=null; state.openHisaab=null; state.editingContainerId=null; render(); }

  function renderLockScreen(){
    let html = '<div style="max-width:320px;margin:60px auto 0;text-align:center;">';
    html += '<h1 style="font-family:var(--font-head);font-size:20px;margin-bottom:6px;">Namo Steels — Purchase Ledger</h1>';
    html += '<p style="color:var(--muted);font-size:12.5px;margin-bottom:24px;">Enter the password to continue</p>';
    html += '<form class="panel" id="lock-form" style="text-align:left;">';
    if(state.authError) html += '<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(state.authError)+'</div>';
    if(state.loadError) html += '<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(state.loadError)+'</div>';
    html += '<div class="field"><label>Password</label><input name="pw" type="password" autofocus required></div>';
    html += '<button class="primary" type="submit" style="width:100%;">Unlock</button>';
    html += '</form></div>';
    return html;
  }

  function render(){
    if(!state.loaded){ app.innerHTML = '<div class="loading">Loading ledger…</div>'; return; }
    if(state.needsAuth){
      app.innerHTML = '<div class="sheet">' + renderLockScreen() + '</div>';
      const lf = document.getElementById('lock-form');
      if(lf) lf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const pw = new FormData(lf).get('pw');
        const btn = lf.querySelector('button'); btn.disabled = true; btn.textContent = 'Checking…';
        await tryPassword(pw);
      });
      return;
    }
    const parts = [];
    parts.push('<header class="top"><h1>Namo Steels — Purchase Ledger</h1><p>Containers, hisaab accounts &amp; supplier balances</p></header>');
    if(state.loadError){
      parts.push('<div style="background:#f5e2dc;border:1px solid var(--red);color:#7a3222;padding:10px 12px;font-size:12.5px;margin-bottom:16px;">Could not read saved data: '+escapeHtml(state.loadError)+'.</div>');
    }
    parts.push('<div style="display:flex;gap:8px;margin-bottom:16px;"><button class="ghost" id="refresh-btn">Refresh</button></div>');
    parts.push('<nav class="tabs">');
    [['containers','Containers'],['hisaab','Hisaab'],['parties','Parties'],['allcontracts','All Open Contracts']].forEach(([k,label])=>{
      parts.push(`<button data-tab="${k}" class="${state.tab===k?'active':''}">${label}</button>`);
    });
    parts.push('</nav>');

    if(state.tab==='containers') parts.push(renderContainersTab());
    if(state.tab==='hisaab') parts.push(renderHisaabTab());
    if(state.tab==='parties') parts.push(renderPartiesTab());
    if(state.tab==='allcontracts') parts.push(renderAllContractsTab());

    app.innerHTML = '<div class="sheet">' + parts.join('') + '</div>';
    bindEvents();
  }

  function supplierOptions(selectedId){
    return state.suppliers.slice().sort((a,b)=>a.name.localeCompare(b.name))
      .map(s=>`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  }
  function containerOptionsFor(){
    return state.containers.slice().sort((a,b)=>(Number(b.seq)||0)-(Number(a.seq)||0))
      .map(c=>{ const s=state.suppliers.find(x=>x.id===c.supplierId); return `<option value="${c.id}" data-supplier="${c.supplierId}">${c.orderNo||('#'+c.seq)} — ${escapeHtml(c.material||'')} — ${s?escapeHtml(s.name):''}</option>`; }).join('');
  }

  // ===================== Shared: container row + detail + grouped list =====================
  function renderContainerRow(c, showParty){
    const s = state.suppliers.find(x=>x.id===c.supplierId);
    const status = computeContainerStatus(c);
    const hisaabTag = c.hisaabSeq ? `<span class="hisaab-tag">Hisaab #${c.hisaabSeq}</span>` : `<span class="hisaab-tag none">No hisaab yet</span>`;
    const subBits = [escapeHtml(c.material||'')];
    if(c.numContainers) subBits.push(c.numContainers+' cont');
    if(c.weight) subBits.push(num(c.weight)+(typeof c.weight==='number'?' t':''));
    if(c.contNo) subBits.push(escapeHtml(c.contNo));
    if(c.shippingLine) subBits.push(escapeHtml(c.shippingLine));
    subBits.push(fmtDate(c.date));
    return `<div class="row-item" data-open-container="${c.id}"><div><div class="name"><span class="seq">${escapeHtml(c.orderNo||('#'+c.seq))}</span> ${showParty && s?escapeHtml(s.name)+' ':''}${hisaabTag}</div><div class="sub">${subBits.filter(Boolean).join(' · ')}</div></div><div><span class="${statusBadgeClass(status)}">${status}</span></div></div>`;
  }

  function renderContainerDetail(c, s){
    const status = computeContainerStatus(c);
    let html = '<div class="detail">';
    html += `<div class="detail-head"><h3>${escapeHtml(c.orderNo||('#'+c.seq))}</h3><span class="${statusBadgeClass(status)}">${status}</span></div>`;
    html += `<div class="ledger-line"><div class="l-desc">Supplier</div><div class="l-amt" style="width:auto;">${s?escapeHtml(s.name):'—'}</div></div>`;

  function renderContainerGroupedList(containers, filterStatuses, showParty){
    let filtered = containers;
    if(filterStatuses && filterStatuses.length){
      filtered = filtered.filter(c=> filterStatuses.includes(computeContainerStatus(c)));
    }
    if(filtered.length===0) return '<div class="empty">No containers match.</div>';
    const sorted = filtered.slice().sort((a,b)=>{
      const oa = STATUS_ORDER.indexOf(computeContainerStatus(a));
      const ob = STATUS_ORDER.indexOf(computeContainerStatus(b));
      if(oa!==ob) return oa-ob;
      return (Number(b.seq)||0)-(Number(a.seq)||0);
    });
    let html = '<div class="row-list">';
    sorted.forEach(c=>{
      const s = state.suppliers.find(x=>x.id===c.supplierId);
      html += renderContainerRow(c, showParty);
      if(state.openContainer===c.id) html += renderContainerDetail(c, s);
    });
    html += '</div>';
    return html;
  }

  // ===================== Live hisaab calc =====================
  function wireHisaabCalc(hf){
    const containerSel = hf.querySelector('#h-container');
    containerSel.addEventListener('change', ()=>{
      const cid = containerSel.value;
      const c = state.containers.find(x=>x.id===cid);
      if(c){
        hf.querySelector('#h-party').value = c.supplierId || '';
        hf.querySelector('#h-material').value = c.material || '';
        hf.querySelector('[name=date]').value = c.date || today();
        if(c.weight) hf.querySelector('#h-weight').value = c.weight;
        refresh();
      }
    });
    const refresh = ()=>{
      const weight = Number(hf.querySelector('#h-weight').value)||0;
      const rate = Number(hf.querySelector('#h-rate').value)||0;
      const advance = Number(hf.querySelector('#h-advance').value)||0;
      const financeCost = Number(hf.querySelector('#h-finance').value)||0;
      const inrRate = Number(hf.querySelector('#h-inrrate').value)||0;
      const bankCharges = Number(hf.querySelector('#h-bank').value)||0;
      const grossAmount = weight*rate;
      const total = grossAmount - advance + financeCost;
      const inrAmount = total*inrRate;
      const netPayable = inrAmount - bankCharges;
      hf.querySelector('#h-amount-display').value = num(grossAmount);
      hf.querySelector('#h-total-display').value = num(total);
      hf.querySelector('#h-inramount-display').value = money(inrAmount);
      hf.querySelector('#h-net-display').textContent = money(netPayable);
    };
    hf.addEventListener('input', refresh);
    refresh();
  }

  function bindEvents(){
    const refreshBtn = document.getElementById('refresh-btn');
    if(refreshBtn) refreshBtn.addEventListener('click', ()=>{ refreshBtn.textContent='Refreshing…'; loadAll(); });

    app.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
    app.querySelectorAll('[data-open-container]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.dataset.openContainer; state.openContainer = state.openContainer===id?null:id; render();
    }));
    app.querySelectorAll('[data-open-hisaab]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.dataset.openHisaab; state.openHisaab = state.openHisaab===id?null:id; render();
    }));
    app.querySelectorAll('[data-open-party-page]').forEach(el=> el.addEventListener('click', ()=>{
      state.activePartyId = el.dataset.openPartyPage; state.partySubTab='containers'; state.openContainer=null; state.openHisaab=null; render();
    }));
    app.querySelectorAll('[data-back-to-parties]').forEach(el=> el.addEventListener('click', ()=>{
      state.activePartyId = null; render();
    }));
    app.querySelectorAll('[data-party-subtab]').forEach(el=> el.addEventListener('click', ()=>{
      state.partySubTab = el.dataset.partySubtab; state.openContainer=null; state.openHisaab=null; render();
    }));
    app.querySelectorAll('[data-party-status-filter]').forEach(el=> el.addEventListener('click', ()=>{
      const st = el.dataset.partyStatusFilter;
      const i = state.partyContainerFilter.indexOf(st);
      if(i>=0) state.partyContainerFilter.splice(i,1); else state.partyContainerFilter.push(st);
      render();
    }));
    app.querySelectorAll('[data-all-status-filter]').forEach(el=> el.addEventListener('click', ()=>{
      const st = el.dataset.allStatusFilter;
      const i = state.allContractsFilter.indexOf(st);
      if(i>=0) state.allContractsFilter.splice(i,1); else state.allContractsFilter.push(st);
      render();
    }));
    app.querySelectorAll('[data-goto-tab]').forEach(el=> el.addEventListener('click', ()=>{
      presetContainer = el.dataset.presetContainer || null;
      state.tab = el.dataset.gotoTab;
      state.openContainer=null; state.openHisaab=null;
      render();
      if(presetContainer){
        const sel = document.getElementById('h-container');
        if(sel){ sel.value = presetContainer; sel.dispatchEvent(new Event('change')); }
      }
    }));
    app.querySelectorAll('[data-edit-container]').forEach(el=> el.addEventListener('click', ()=>{
      state.editingContainerId = el.dataset.editContainer; state.openContainer=null; state.tab='containers'; render();
    }));
    app.querySelectorAll('[data-toggle-duty]').forEach(el=> el.addEventListener('change', (e)=>{
      e.stopPropagation(); toggleContainerFlag(el.dataset.toggleDuty, 'dutyPaid');
    }));
    app.querySelectorAll('[data-toggle-shipping]').forEach(el=> el.addEventListener('change', (e)=>{
      e.stopPropagation(); toggleContainerFlag(el.dataset.toggleShipping, 'shippingPaid');
    }));

    app.querySelectorAll('[data-delete-container]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this container? This cannot be undone.')) return;
      el.disabled = true;
      try{ state.openContainer=null; await deleteContainer(el.dataset.deleteContainer); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-hisaab]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this hisaab? This cannot be undone.')) return;
      el.disabled = true;
      try{ state.openHisaab=null; await deleteHisaab(el.dataset.deleteHisaab); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-payment]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this payment? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deletePayment(el.dataset.deletePayment); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-claim]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this claim? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deleteClaim(el.dataset.deleteClaim); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));

    const cf = document.getElementById('container-form');
    if(cf){
      const cancelBtn = document.getElementById('cancel-edit-container');
      if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingContainerId=null; render(); });
      cf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(cf);
        const editingId = state.editingContainerId;
        const btn = cf.querySelector('button.primary'); btn.disabled = true; btn.textContent='Saving…';
        let data;
        if(editingId){
          const existing = state.containers.find(c=>c.id===editingId);
          data = Object.assign({}, existing, {
            supplierId: fd.get('supplierId')||'', date: fd.get('date')||today(),
            material: (fd.get('material')||'').trim(), numContainers: Number(fd.get('numContainers'))||0,
            price: Number(fd.get('price'))||0, contNo: (fd.get('contNo')||'').trim(),
            shippingLine: (fd.get('shippingLine')||'').trim(), weight: Number(fd.get('weight'))||0,
            notes: (fd.get('notes')||'').trim()
          });
        } else {
          const seq = nextContainerSeq();
          const date = fd.get('date')||today();
          data = {
            id: uid(), seq, orderNo: generateOrderNo(seq, date), supplierId: fd.get('supplierId')||'',
            date, material: (fd.get('material')||'').trim(), numContainers: Number(fd.get('numContainers'))||0,
            price: Number(fd.get('price'))||0, contNo: (fd.get('contNo')||'').trim(),
            shippingLine: (fd.get('shippingLine')||'').trim(), weight: Number(fd.get('weight'))||0,
            notes: (fd.get('notes')||'').trim(), dutyPaid:false, shippingPaid:false, hisaabSeq:null
          };
        }
        try{ await saveContainer(data); state.editingContainerId=null; render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent=editingId?'Update container':'Save container'; alert('Could not save — try again.'); }
      });
    }

    const hf = document.getElementById('hisaab-form');
    if(hf){
      wireHisaabCalc(hf);
      if(presetContainer){ const sel = hf.querySelector('#h-container'); sel.value = presetContainer; sel.dispatchEvent(new Event('change')); }
      hf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(hf);
        const weight = Number(fd.get('weight'))||0, rate = Number(fd.get('rate'))||0, advance = Number(fd.get('advance'))||0;
        const financeCost = Number(fd.get('financeCost'))||0;
        const inrRate = Number(fd.get('inrRate'))||0, bankCharges = Number(fd.get('bankCharges'))||0;
        const grossAmount = weight*rate, total = grossAmount-advance+financeCost, inrAmount = total*inrRate;
        const netPayable = inrAmount - bankCharges;
        const data = {
          id: uid(), seq: nextHisaabSeq(), containerId: fd.get('containerId')||null, partyId: fd.get('partyId'),
          date: fd.get('date')||today(), weight, material: (fd.get('material')||'').trim(), rate,
          grossAmount, advance, financeCost, total, inrRate, inrAmount, bankCharges, netPayable
        };
        if(!data.partyId){ alert('Please select a party.'); return; }
        const btn = hf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        try{ presetContainer=null; await saveHisaab(data); render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save hisaab'; alert('Could not save — try again.'); }
      });
    }

    const pf = document.getElementById('payment-form');
    if(pf){
      const payContainerSel = pf.querySelector('#pay-container');
      payContainerSel.addEventListener('change', ()=>{
        const c = state.containers.find(x=>x.id===payContainerSel.value);
        if(c) pf.querySelector('#pay-party').value = c.supplierId || '';
      });
      pf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(pf);
        const data = { id: uid(), containerId: fd.get('containerId')||null, partyId: fd.get('partyId'), amount: Number(fd.get('amount'))||0, date: fd.get('date')||today(), note: (fd.get('note')||'').trim() };
        if(!data.partyId){ alert('Please select a party.'); return; }
        const btn = pf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        try{ await savePayment(data); render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save payment'; alert('Could not save — try again.'); }
      });
    }

    const clf = document.getElementById('claim-form');
    if(clf){
      const clContainerSel = clf.querySelector('#cl-container');
      clContainerSel.addEventListener('change', ()=>{
        const c = state.containers.find(x=>x.id===clContainerSel.value);
        if(c) clf.querySelector('#cl-party').value = c.supplierId || '';
      });
      clf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(clf);
        const data = { id: uid(), containerId: fd.get('containerId')||null, partyId: fd.get('partyId'), amount: Number(fd.get('amount'))||0, date: fd.get('date')||today(), note: (fd.get('note')||'').trim() };
        if(!data.partyId){ alert('Please select a party.'); return; }
        const btn = clf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        try{ await saveClaim(data); render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save claim'; alert('Could not save — try again.'); }
      });
    }

    const sf = document.getElementById('supplier-form');
    if(sf) sf.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(sf);
      const data = { id: uid(), name: fd.get('name').trim(), phone: fd.get('phone').trim(), createdAt: today() };
      if(!data.name) return;
      const btn = sf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
      try{ await saveSupplier(data); render(); }
      catch(err){ console.error(err); btn.disabled=false; btn.textContent='Add supplier'; alert('Could not save — try again.'); }
    });
  }

  setTimeout(()=>{ if(!state.loaded){ state.loaded = true; state.loadError = 'Timed out reaching shared storage — check your internet connection and try Refresh.'; render(); } }, 8000);

  loadAll();
})();
</script>
</body>
</html>
