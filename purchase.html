<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Namo Steels — Purchase Ledger</title>
<meta name="theme-color" content="#143028">
<meta name="description" content="Purchase ledger for Namo Steels — containers, hisaab accounts and supplier balances">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Namo Purchase">
</head>
<body>
<style>
  :root{
    --desk:#dfe5e1; --bg:#f6f8f6; --surface:#edf1ee; --surface-2:#e2e9e4; --line:#cbd5ce;
    --text:#1b2a26; --muted:#5b6d66;
    --accent:#1f6f55; --accent-dim:#337d65;
    --ink:#143028; --brass:#c09a45;
    --rust:#b0522a;
    --red:#a63a2b;
    --font-head:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-body:'Avenir Next', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--desk);}
  body{ background:var(--desk); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
  #app{max-width:640px; margin:0 auto; padding:0 0 48px;}
  .sheet{
    background:var(--bg); border:1px solid var(--line); border-left:5px solid var(--accent-dim);
    border-radius:2px 10px 10px 2px; box-shadow:0 10px 28px rgba(39,53,48,0.14), 0 2px 6px rgba(39,53,48,0.08);
    margin:22px 10px 0; padding:22px 18px 26px;
  }
  .col-main, .col-side{min-width:0;}

  /* Laptop / desktop: a wider page and a two-column layout so a form and
     its list sit side by side instead of stacking endlessly. */
  @media (min-width:860px){
    body{padding:28px 0;}
    #app{max-width:1080px;}
    .sheet{margin:0 auto; padding:30px 38px 40px;}
    header.top h1{font-size:25px;}
    .col-grid{display:grid; grid-template-columns:380px 1fr; gap:28px; align-items:start;}
    .stat-row{max-width:520px;}
    .balance-grid{max-width:520px;}
  }
  @media (min-width:1200px){
    #app{max-width:1240px;}
  }
  header.top{margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line);}
  header.top h1{font-family:var(--font-head); font-weight:600; font-size:22px; letter-spacing:0.1px; color:var(--text);}
  header.top p{color:var(--muted); font-size:12.5px; margin-top:2px; font-style:italic;}

  nav.tabs{display:flex; gap:5px; margin-bottom:20px; flex-wrap:wrap;}
  nav.tabs button{
    background:var(--surface-2); color:var(--muted); border:1px solid var(--line);
    border-bottom:2px solid var(--accent-dim); font-family:var(--font-head); font-weight:600;
    font-size:12.5px; padding:8px 12px; cursor:pointer; border-radius:6px 6px 0 0;
    position:relative; top:1px; transition:background 0.15s ease, color 0.15s ease;
  }
  nav.tabs button:hover:not(.active){background:var(--line); color:var(--text);}
  nav.tabs button.active{ background:var(--bg); color:var(--accent-dim); border-color:var(--accent-dim); border-bottom-color:var(--bg); top:0; }

  .stat-row{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
  .stat{flex:1; min-width:130px; background:var(--surface); border:1px solid var(--line); padding:12px 13px 11px;}
  .stat .label{color:var(--muted); font-size:11px;}
  .stat .value{font-family:var(--font-head); font-size:19px; font-variant-numeric:tabular-nums; margin-top:3px;}

  .section-title{font-family:var(--font-head); font-size:15px; font-weight:600; margin:22px 0 10px; color:var(--text);}
  .section-title:first-child{margin-top:0;}

  .row-list{border-top:1px solid var(--line);}
  .row-item{ display:flex; justify-content:space-between; align-items:center; padding:11px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row-item:hover{background:var(--surface);}
  .row-item .name{font-weight:500;}
  .row-item .sub{color:var(--muted); font-size:12px; margin-top:1px;}
  .row-item .amt{font-variant-numeric:tabular-nums; font-weight:600;}
  .amt.pos{color:var(--rust);} .amt.zero{color:var(--muted); font-weight:400;} .amt.neg{color:var(--accent);}

  .empty{color:var(--muted); font-size:13px; padding:16px 2px;}

  form.panel{background:var(--surface); border:1px solid var(--line); padding:14px; margin-bottom:20px;}
  form.panel .field{margin-bottom:10px;}
  form.panel label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  form.panel input, form.panel select, form.panel textarea{ width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:8px 9px; font-family:var(--font-body); font-size:13.5px; font-variant-numeric:tabular-nums; }
  form.panel input[type=checkbox]{width:auto; accent-color:var(--accent);}
  form.panel textarea{font-variant-numeric:normal; resize:vertical; min-height:46px;}
  form.panel input:focus, form.panel select:focus, form.panel textarea:focus{outline:1px solid var(--accent);}
  .field-row{display:flex; gap:10px;} .field-row .field{flex:1;}
  .field-row3{display:flex; gap:8px;} .field-row3 .field{flex:1;}
  .check-row{display:flex; gap:18px; margin-bottom:10px;}
  .check-row label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text);}
  button.primary{ background:var(--accent); color:#f4f6ef; border:none; padding:9px 16px; font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer; margin-top:2px; transition:background 0.15s ease; }
  button.primary:hover:not(:disabled){background:var(--accent-dim);}
  button.primary:disabled{opacity:0.5; cursor:default;}
  button.ghost{ background:none; border:1px solid var(--line); color:var(--muted); padding:8px 14px; font-size:12.5px; cursor:pointer; font-family:var(--font-body); }
  .form-sub-title{font-family:var(--font-head); font-size:14px; margin-bottom:10px; color:var(--text);}

  .calc-block{background:var(--surface-2); border:1px solid var(--line); padding:10px 12px; margin:10px 0;}
  .calc-line{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); padding:3px 0; font-variant-numeric:tabular-nums;}
  .calc-line.net{border-top:1px solid var(--line); margin-top:6px; padding-top:8px; color:var(--text); font-weight:600; font-size:14px;}

  .voucher{background:var(--surface); border:1px solid var(--accent-dim); padding:14px; margin:-1px 0 14px; box-shadow:0 1px 3px rgba(39,53,48,0.06);}
  .voucher-head{display:flex; justify-content:space-between; font-family:var(--font-head); font-size:15px; margin-bottom:10px;}
  .voucher-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .voucher-row .vr-label{color:var(--muted);}
  .voucher-row .vr-val{font-variant-numeric:tabular-nums; text-align:right;}
  .voucher-row.net{font-weight:600; border-top:1px solid var(--line); margin-top:4px; padding-top:9px; border-bottom:none;}
  .voucher-note{font-size:12px; color:var(--muted); font-style:italic; margin-top:6px;}
  .seq{color:var(--muted); font-family:var(--font-head); font-size:12px;}
  .badge{display:inline-block; font-size:11px; padding:2px 7px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;}
  .badge-loaded{border-color:var(--rust); color:var(--rust);}
  .badge-pending{border-color:var(--red); color:var(--red);}
  .badge-arrived{border-color:var(--accent); color:var(--accent);}
  .hisaab-tag{font-size:11px; color:var(--rust); margin-left:6px;}
  .hisaab-tag.none{color:var(--muted);}
  .line-del{background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:2px 0 2px 10px; flex-shrink:0;}
  .line-del:hover{color:var(--red);}

  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .chip{background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:11.5px; padding:6px 11px; border-radius:14px; cursor:pointer; font-family:var(--font-body);}
  .chip.chip-active{background:var(--accent); color:#f4f6ef; border-color:var(--accent);}

  .detail{background:var(--surface); border:1px solid var(--accent-dim); padding:14px; margin:-1px 0 14px; box-shadow:0 1px 3px rgba(39,53,48,0.06);}
  .detail-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .detail-head h3{font-family:var(--font-head); font-size:16px;}
  .balance-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 14px;}
  .balance-grid .b-item{background:var(--surface-2); border:1px solid var(--line); padding:9px 10px;}
  .balance-grid .b-item .b-label{font-size:10.5px; color:var(--muted);}
  .balance-grid .b-item .b-val{font-family:var(--font-head); font-size:16px; font-variant-numeric:tabular-nums; margin-top:2px;}
  .ledger-line{display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .ledger-line .l-date{color:var(--muted); width:58px; flex-shrink:0;}
  .ledger-line .l-desc{flex:1;}
  .ledger-line .l-amt{font-variant-numeric:tabular-nums; text-align:right; width:80px;}
  .quick-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .loading{color:var(--muted); padding:20px 2px; font-size:13px;}
  .rp-toolbar{display:flex; gap:8px; max-width:1240px; margin:14px auto 10px; padding:0 10px;}
  .report{background:#fff; max-width:1240px; margin:0 auto; border:1px solid #cfd8d2; box-shadow:0 6px 22px rgba(0,0,0,0.12); padding-bottom:22px; color:#1d2b25; font-family:Helvetica,Arial,sans-serif;}
  .rp-band{display:flex; align-items:center; gap:22px; background:#0d5a42; color:#fff; padding:14px 18px; flex-wrap:wrap;}
  .rp-logo{width:42px; height:42px; background:#073b2b; border:2px solid #c9a23a; color:#e6c76a; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:Georgia,serif; font-size:16px;}
  .rp-title{font-size:20px; font-weight:700; letter-spacing:0.3px;}
  .rp-sub{font-size:12px;}
  .rp-open{font-size:12px; font-weight:700; color:#f1d56e; margin-left:auto;}
  .rp-stamp{font-size:11px;}
  .rp-gold{height:5px; background:#c9a23a; margin-bottom:14px;}
  .rp-section{margin:20px 18px 8px; font-size:13px; font-weight:700; color:#0d5a42; border-bottom:2px solid #c9a23a; padding-bottom:4px;}
  .rp-table{width:calc(100% - 36px); margin:0 18px; border-collapse:collapse; font-size:11.5px;}
  .rp-table th{background:#0f7050; color:#fff; text-align:left; font-size:10.5px; padding:7px 6px; border:1px solid #0d5a42; text-transform:uppercase;}
  .rp-table td{padding:7px 6px; border:1px solid #c8d0cb; vertical-align:top;}
  .rp-table tbody tr:nth-child(even){background:#f3f7f4;}
  .rp-table td.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rp-sum{max-width:460px;} .rp-sum td{font-size:12.5px;}
  .rp-sum tr.rp-total td{background:#e4efe8; font-weight:700; border-top:2px solid #0d5a42;}
  .rp-empty{margin:0 18px; padding:12px; font-size:12px; color:#6b786f; border:1px dashed #c8d0cb;}
  @media (max-width:859px){ .report{overflow-x:auto;} .rp-table{min-width:900px;} }
  @media print{
    @page{size:A4 landscape; margin:8mm;}
    body{background:#fff !important; padding:0 !important;}
    .no-print{display:none !important;}
    .report{box-shadow:none; border:none; max-width:none;}
    .rp-band,.rp-table th,.rp-gold,.rp-logo,.rp-sum tr.rp-total td,.rp-table tbody tr:nth-child(even){-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .rp-section{break-after:avoid;} .rp-table tr{break-inside:avoid;}
  }
  .search-box{margin-bottom:12px;}
  .search-box input{width:100%; max-width:520px; background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 12px; font-size:14px; font-family:var(--font-body);}
  .search-box input:focus{outline:1px solid var(--accent);}
  .page-title{margin-bottom:16px;}
  .page-title h2{font-family:var(--font-head); font-size:19px; font-weight:600; color:var(--text);}
  .page-title p{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .group-title{font-family:var(--font-head); font-size:12.5px; font-weight:600; color:var(--accent-dim); border-bottom:1px solid var(--line); padding-bottom:4px; margin:14px 0 10px;}
  .list-head{font-family:var(--font-head); font-size:13px; font-weight:600; color:var(--text); margin:4px 0 8px;}
  .count{display:inline-block; min-width:18px; text-align:center; font-size:11px; font-weight:500; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:0 6px; margin-left:4px;}
  details.arrived-group{margin-top:18px; border:1px solid var(--line); background:var(--surface);}
  details.arrived-group > summary{cursor:pointer; padding:10px 12px; font-family:var(--font-head); font-size:13px; font-weight:600; color:var(--accent-dim); list-style:none;}
  details.arrived-group > summary::-webkit-details-marker{display:none;}
  details.arrived-group > summary::before{content:'▸'; display:inline-block; width:14px;}
  details.arrived-group[open] > summary::before{content:'▾';}
  details.arrived-group .row-list{border-top:1px solid var(--line); padding:0 10px;}
  .row-item .name .seq{color:var(--text); font-weight:700; font-size:13.5px;}
  .ctag{color:var(--muted); font-size:12px;}
  .pay-hint{font-size:12px; color:var(--muted); margin:-2px 0 10px;}
  .link-btn{background:none; border:none; color:var(--accent); text-decoration:underline; cursor:pointer; font-size:12px; padding:0 0 0 4px; font-family:var(--font-body);}
  .inline-check{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text);}
  .inline-check input{accent-color:var(--accent);}

  /* ===== Laptop / desktop layout: sidebar + roomy content, larger type ===== */
  .side-foot{display:none;}
  @media (min-width:860px){
    html,body{background:var(--bg);}
    body{font-size:16px; line-height:1.55; padding:0;}
    #app{max-width:none; padding:0;}
    .sheet{margin:0; padding:0; border:none; border-radius:0; box-shadow:none; background:var(--bg); min-height:100vh;}
    .shell{display:grid; grid-template-columns:260px 1fr; min-height:100vh;}
    .side{background:var(--ink); color:#e6eee9; padding:30px 18px 22px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;}
    .side header.top{border-bottom:1px solid rgba(255,255,255,0.14); margin:0 6px 22px; padding-bottom:18px;}
    .side header.top h1{color:#fff; font-size:25px; letter-spacing:0.2px;}
    .side header.top p{color:#9fb5ab; font-size:14px; margin-top:4px; font-style:normal;}
    .side nav.tabs{flex-direction:column; gap:3px; margin:0;}
    .side nav.tabs button{background:transparent; color:#b4c6bd; border:none; border-left:3px solid transparent; border-radius:0 8px 8px 0; font-family:var(--font-body); font-weight:500; font-size:16px; text-align:left; padding:12px 16px; top:0;}
    .side nav.tabs button:hover:not(.active){background:rgba(255,255,255,0.07); color:#fff;}
    .side nav.tabs button.active{background:rgba(255,255,255,0.11); color:#fff; border-left-color:var(--brass); font-weight:600;}
    .side-foot{display:block; margin-top:auto; padding:0 6px;}
    .side-foot button{width:100%; background:transparent; color:#b4c6bd; border:1px solid rgba(255,255,255,0.22); border-radius:6px; font-size:14px; padding:10px;}
    .side-foot button:hover{background:rgba(255,255,255,0.08); color:#fff;}
    .main{padding:38px 52px 70px; min-width:0;}
    .main > *{max-width:1400px;}

    .page-title{margin-bottom:22px;}
    .page-title h2{font-size:32px; letter-spacing:0.1px;}
    .page-title p{font-size:15.5px; margin-top:4px;}
    .section-title{font-size:20px; margin:30px 0 14px;}
    .list-head{font-size:15.5px; margin:2px 0 10px;}
    .stat-row{gap:16px; margin-bottom:30px; max-width:none;}
    .stat{padding:18px 20px; border-radius:10px; background:#fff; border:1px solid var(--line); border-top:3px solid var(--accent);}
    .stat .label{font-size:13.5px;}
    .stat .value{font-size:30px; margin-top:6px;}
    .col-grid{grid-template-columns:490px 1fr; gap:44px;}
    form.panel{padding:22px; border-radius:10px; background:#fff; margin-bottom:26px;}
    .form-sub-title{font-size:19px; margin-bottom:14px;}
    .group-title{font-size:14px; margin:20px 0 12px;}
    form.panel label{font-size:13.5px; margin-bottom:5px;}
    form.panel input, form.panel select, form.panel textarea{font-size:15.5px; padding:11px 12px; border-radius:6px; background:var(--bg);}
    form.panel .field{margin-bottom:14px;}
    .field-row, .field-row3{gap:14px;}
    button.primary{font-size:15.5px; padding:12px 22px; border-radius:6px;}
    button.ghost{font-size:14.5px; padding:10px 16px; border-radius:6px;}
    .inline-check{font-size:14.5px;}
    .row-list{border-top:1px solid var(--line); background:#fff; border-radius:10px; border:1px solid var(--line);}
    .row-item{padding:16px 18px;}
    .row-item .name{font-size:16.5px;}
    .row-item .sub{font-size:14px; margin-top:3px;}
    .row-item .amt{font-size:17px;}
    .row-item .name .seq{font-size:16px;}
    .badge{font-size:12.5px; padding:4px 10px; border-radius:12px;}
    .hisaab-tag{font-size:12.5px;}
    .ctag{font-size:14px;}
    .detail, .voucher{padding:20px 22px; font-size:15px; margin:0; border-radius:0; border-left:3px solid var(--accent);}
    .detail-head h3, .voucher-head{font-size:20px;}
    .ledger-line, .voucher-row{font-size:15px; padding:9px 0;}
    nav.tabs{margin-bottom:22px;}
    .main nav.tabs button{font-size:15px; padding:10px 18px;}
    .chip{font-size:14px; padding:8px 15px; border-radius:18px;}
    .balance-grid{grid-template-columns:repeat(4,1fr); max-width:none; gap:14px;}
    .balance-grid .b-item{padding:14px 16px; background:#fff; border-radius:10px;}
    .balance-grid .b-item .b-label{font-size:13px;}
    .balance-grid .b-item .b-val{font-size:24px;}
    details.arrived-group{border-radius:10px; background:#fff;}
    details.arrived-group > summary{font-size:16px; padding:14px 18px;}
    .search-box input{font-size:16px; padding:13px 15px; max-width:640px; border-radius:8px; background:#fff;}
    .empty{font-size:15px;}
    .pay-hint{font-size:14px;}
    .calc-line{font-size:14.5px;} .calc-line.net{font-size:17px;}
  }
  @media (min-width:1500px){ body{font-size:17px;} .col-grid{grid-template-columns:540px 1fr;} }
  @media print{ .side{display:none !important;} .shell{display:block !important;} }
</style>

<div id="app"><div class="loading">Loading ledger…</div></div>

<script>
(function(){
  const app = document.getElementById('app');
  const STATUS_ORDER = ['Arrived', 'Arrived — Payment Pending', 'Loaded', 'Booked'];

  let state = {
    containers: [], hisaabs: [], payments: [], suppliers: [], claims: [],
    tab: 'containers', openContainer: null, openHisaab: null,
    editingContainerId: null,
    activePartyId: null, reportPartyId: null, partySubTab: 'containers',
    allContractsFilter: [], partyContainerFilter: [], arrivedOpen: {}, allSearch: '',
    loaded:false, loadError:null, needsAuth:false, authError:null
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function num(n){ return (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:2}); }
  function numW(n){ return (Number(n)||0).toLocaleString('en-IN', {maximumFractionDigits:6}); }
  function money(n){ return '₹' + Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
  function today(){ return new Date().toISOString().slice(0,10); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  const API_URL = 'https://script.google.com/macros/s/AKfycbzODOIf1Imymd9LR2Hu9NQ-LrGmcVoT-TVEdOyS-dXLYjU1efcNjJSL09aESkGRs2_7nA/exec';
  const PW_KEY = 'NAMO_PURCHASE_PW';
  let currentPw = localStorage.getItem(PW_KEY) || '';

  async function apiGetAll(prefix){
    const res = await fetch(API_URL + '?action=getAll&prefix=' + encodeURIComponent(prefix) + '&pw=' + encodeURIComponent(currentPw));
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  async function apiSet(key, value){
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'set', key, value, pw: currentPw }) });
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }
  async function apiDelete(key){
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'delete', key, pw: currentPw }) });
    const data = await res.json();
    if(data && data.error === 'unauthorized'){ const err = new Error('unauthorized'); err.code='unauthorized'; throw err; }
    if(data && data.error) throw new Error(data.error);
    return data;
  }

  async function loadAll(){
    if(!currentPw){ state.needsAuth = true; state.loaded = true; render(); return; }
    try{
      const [containerMap, hisaabMap, paymentMap, supplierMap, claimMap] = await Promise.all([
        apiGetAll('container:'), apiGetAll('hisaab:'), apiGetAll('payment:'), apiGetAll('supplier:'), apiGetAll('claim:')
      ]);
      state.containers = Object.values(containerMap).map(v=>JSON.parse(v));
      state.hisaabs = Object.values(hisaabMap).map(v=>JSON.parse(v));
      state.payments = Object.values(paymentMap).map(v=>JSON.parse(v));
      state.suppliers = Object.values(supplierMap).map(v=>JSON.parse(v));
      state.claims = Object.values(claimMap).map(v=>JSON.parse(v));
      state.loadError = null; state.needsAuth = false; state.authError = null;
    }catch(e){
      console.error('load error', e);
      if(e.code==='unauthorized'){
        localStorage.removeItem(PW_KEY); currentPw = '';
        state.needsAuth = true; state.authError = 'Incorrect password.';
      } else { state.loadError = (e && e.message) ? e.message : String(e); }
    }
    state.loaded = true;
    render();
  }

  async function tryPassword(pw){
    currentPw = pw; state.authError = null;
    await loadAll();
    if(!state.needsAuth) localStorage.setItem(PW_KEY, pw);
  }

  function nextContainerSeq(){ return state.containers.reduce((m,c)=> Math.max(m, Number(c.seq)||0), 0) + 1; }
  function nextHisaabSeq(){ return state.hisaabs.reduce((m,h)=> Math.max(m, Number(h.seq)||0), 0) + 1; }
  function generateOrderNo(seq, dateStr){
    const year = (dateStr ? new Date(dateStr) : new Date()).getFullYear();
    return 'NS' + String(seq).padStart(4,'0') + year;
  }

  // ---- Container status: fully automatic, derived from the data itself ----
  function hisaabsForContainer(c){ return state.hisaabs.filter(h=>h.containerId===c.id); }
  function containerHisaab(c){ return hisaabsForContainer(c)[0] || null; }
  function containerNet(c){ return hisaabsForContainer(c).reduce((t,h)=> t+(Number(h.netPayable)||0), 0); }
  function containerWeightOf(c){
    if(Number(c.weight)) return Number(c.weight);
    return hisaabsForContainer(c).reduce((t,h)=> t+(Number(h.weight)||0), 0);
  }
  // Payments tied to a container count against it directly. Payments that are
  // not tied to any container (general payments) are applied to that supplier's
  // oldest unpaid containers first, so statuses stay correct either way.
  let paidCache = null;
  function getPaidMap(){
    if(paidCache) return paidCache;
    const paid = {};
    state.containers.forEach(c=>{ paid[c.id] = 0; });
    const pool = {};
    state.payments.forEach(p=>{
      const amt = Number(p.amount)||0;
      if(p.containerId && paid[p.containerId]!==undefined) paid[p.containerId] += amt;
      else pool[p.partyId] = (pool[p.partyId]||0) + amt;
    });
    Object.keys(pool).forEach(pid=>{
      let left = pool[pid];
      state.containers
        .filter(c=> c.supplierId===pid && hisaabsForContainer(c).length)
        .sort((x,y)=>{
          const sx = Math.min(...hisaabsForContainer(x).map(h=>Number(h.seq)||0));
          const sy = Math.min(...hisaabsForContainer(y).map(h=>Number(h.seq)||0));
          return sx-sy;
        })
        .forEach(c=>{
          if(left<=0) return;
          const need = Math.max(0, containerNet(c) - paid[c.id]);
          const take = Math.min(need, left);
          paid[c.id] += take; left -= take;
        });
    });
    paidCache = paid;
    return paid;
  }
  function containerPaid(c){ return getPaidMap()[c.id] || 0; }
  function containerBalance(c){
    if(!hisaabsForContainer(c).length) return null;
    return containerNet(c) - containerPaid(c);
  }
  function computeContainerStatus(c){
    if(hisaabsForContainer(c).length){
      const bal = containerBalance(c);
      return (bal!==null && bal<=1) ? 'Arrived' : 'Arrived — Payment Pending';
    }
    if(c.contNo || c.weight) return 'Loaded';
    return 'Booked';
  }
  function statusBadgeClass(status){
    if(status==='Arrived') return 'badge badge-arrived';
    if(status==='Arrived — Payment Pending') return 'badge badge-pending';
    if(status==='Loaded') return 'badge badge-loaded';
    return 'badge';
  }

  // ---- Balances ----
  function supplierContainerBalance(partyId){
    return state.hisaabs.filter(h=>h.partyId===partyId).reduce((s,h)=> s + (Number(h.netPayable)||0), 0);
  }
  function supplierAdvanceBalance(partyId){
    return state.hisaabs.filter(h=>h.partyId===partyId).reduce((s,h)=> s + (Number(h.advance)||0), 0);
  }
  function supplierClaimBalance(partyId){
    return state.claims.filter(cl=>cl.partyId===partyId).reduce((s,cl)=> s + (Number(cl.amount)||0), 0);
  }
  function supplierPayments(partyId){
    return state.payments.filter(p=>p.partyId===partyId).reduce((s,p)=> s + (Number(p.amount)||0), 0);
  }
  function supplierNetBalance(partyId){
    // Claims are tracked separately (they can take years to resolve) and are
    // deliberately NOT netted into what's currently owed.
    return supplierContainerBalance(partyId) - supplierPayments(partyId);
  }
  function totalPayable(){
    return state.suppliers.reduce((s,sup)=> s + Math.max(0, supplierNetBalance(sup.id)), 0);
  }

  async function saveContainer(data){
    await apiSet('container:'+data.id, JSON.stringify(data));
    const idx = state.containers.findIndex(c=>c.id===data.id);
    if(idx>=0) state.containers[idx] = data; else state.containers.push(data);
  }
  async function saveHisaab(data){
    await apiSet('hisaab:'+data.id, JSON.stringify(data));
    state.hisaabs.push(data);
    if(data.containerId){
      const c = state.containers.find(x=>x.id===data.containerId);
      if(c){ c.hisaabSeq = data.seq; await apiSet('container:'+c.id, JSON.stringify(c)); }
    }
  }
  async function savePayment(data){ await apiSet('payment:'+data.id, JSON.stringify(data)); state.payments.push(data); }
  async function saveSupplier(data){ await apiSet('supplier:'+data.id, JSON.stringify(data)); state.suppliers.push(data); }
  async function saveClaim(data){ await apiSet('claim:'+data.id, JSON.stringify(data)); state.claims.push(data); }

  async function deleteContainer(id){ await apiDelete('container:'+id); state.containers = state.containers.filter(c=>c.id!==id); }
  async function deleteHisaab(id){ await apiDelete('hisaab:'+id); state.hisaabs = state.hisaabs.filter(h=>h.id!==id); }
  async function deletePayment(id){ await apiDelete('payment:'+id); state.payments = state.payments.filter(p=>p.id!==id); }
  async function deleteClaim(id){ await apiDelete('claim:'+id); state.claims = state.claims.filter(c=>c.id!==id); }

  async function toggleContainerFlag(id, field){
    const c = state.containers.find(x=>x.id===id); if(!c) return;
    c[field] = !c[field];
    await apiSet('container:'+id, JSON.stringify(c));
    render();
  }

  function setTab(t){ state.tab = t; state.openContainer=null; state.openHisaab=null; state.editingContainerId=null; render(); }

  function renderLockScreen(){
    let html = '<div style="max-width:320px;margin:60px auto 0;text-align:center;">';
    html += '<h1 style="font-family:var(--font-head);font-size:20px;margin-bottom:6px;">Namo Steels — Purchase Ledger</h1>';
    html += '<p style="color:var(--muted);font-size:12.5px;margin-bottom:24px;">Enter the password to continue</p>';
    html += '<form class="panel" id="lock-form" style="text-align:left;">';
    if(state.authError) html += '<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(state.authError)+'</div>';
    if(state.loadError) html += '<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">'+escapeHtml(state.loadError)+'</div>';
    html += '<div class="field"><label>Password</label><input name="pw" type="password" autofocus required></div>';

  function render(){
    if(!state.loaded){ app.innerHTML = '<div class="loading">Loading ledger…</div>'; return; }
    if(state.needsAuth){
      app.innerHTML = '<div class="sheet">' + renderLockScreen() + '</div>';
      const lf = document.getElementById('lock-form');
      if(lf) lf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const pw = new FormData(lf).get('pw');
        const btn = lf.querySelector('button'); btn.disabled = true; btn.textContent = 'Checking…';
        await tryPassword(pw);
      });
      return;
    }
    paidCache = null;
    if(state.reportPartyId && state.suppliers.find(x=>x.id===state.reportPartyId)){
      app.innerHTML = renderPartyReport(state.reportPartyId);
      app.querySelector('[data-report-back]').addEventListener('click', ()=>{ state.reportPartyId=null; render(); });
      app.querySelector('[data-report-print]').addEventListener('click', ()=> window.print());
      return;
    }
    const side = [], main = [];
    side.push('<header class="top"><h1>Namo Steels</h1><p>Purchase Ledger</p></header>');
    side.push('<nav class="tabs">');
    [['containers','Containers'],['hisaab','Hisaab & Payments'],['parties','Parties'],['allcontracts','All Contracts']].forEach(([k,label])=>{
      side.push(`<button data-tab="${k}" class="${state.tab===k?'active':''}">${label}</button>`);
    });
    side.push('</nav>');
    side.push('<div class="side-foot"><button class="ghost" id="refresh-btn">Refresh data</button></div>');
    if(state.loadError){
      main.push('<div style="background:#f5e2dc;border:1px solid var(--red);color:#7a3222;padding:10px 12px;font-size:13px;margin-bottom:16px;">Could not read saved data: '+escapeHtml(state.loadError)+'.</div>');
    }
    if(state.tab==='containers') main.push(renderContainersTab());
    if(state.tab==='hisaab') main.push(renderHisaabTab());
    if(state.tab==='parties') main.push(renderPartiesTab());
    if(state.tab==='allcontracts') main.push(renderAllContractsTab());

    app.innerHTML = '<div class="sheet"><div class="shell"><aside class="side">' + side.join('') + '</aside><main class="main">' + main.join('') + '</main></div></div>';
    bindEvents();
  }

  function supplierOptions(selectedId){
    return state.suppliers.slice().sort((a,b)=>a.name.localeCompare(b.name))
      .map(s=>`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  }
  function containerLabel(c){
    const sup = state.suppliers.find(x=>x.id===c.supplierId);
    const w = containerWeightOf(c);
    const bits = [c.orderNo||('#'+c.seq)];
    if(c.material) bits.push(c.material);
    if(w) bits.push(numW(w)+' wt');
    if(c.contNo) bits.push('Cont. '+c.contNo);
    if(sup) bits.push(sup.name);
    return bits.join(' · ');
  }
  function containerOptionsFor(){
    const sorted = state.containers.slice().sort((a,b)=>(Number(b.seq)||0)-(Number(a.seq)||0));
    const opt = c=> `<option value="${c.id}" data-supplier="${c.supplierId}">${escapeHtml(containerLabel(c))}</option>`;
    const open = sorted.filter(c=>computeContainerStatus(c)!=='Arrived');
    const arrived = sorted.filter(c=>computeContainerStatus(c)==='Arrived');
    let h = '';
    if(open.length) h += '<optgroup label="Open contracts">' + open.map(opt).join('') + '</optgroup>';
    if(arrived.length) h += '<optgroup label="Arrived containers (settled)">' + arrived.map(opt).join('') + '</optgroup>';
    return h;
  }
  // Compact identity tag used wherever a container is mentioned:
  // contract no., weight and container no.
  function containerTag(c){
    if(!c) return '';
    const w = containerWeightOf(c);
    let h = `<span class="seq">${escapeHtml(c.orderNo||('#'+c.seq))}</span>`;
    const bits = [];
    if(w) bits.push('Wt '+numW(w));
    if(c.contNo) bits.push('Cont. '+escapeHtml(c.contNo));
    if(bits.length) h += ` <span class="ctag">${bits.join(' · ')}</span>`;
    return h;
  }
  function pageHeading(title, sub){
    return `<div class="page-title"><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div>`;
  }

  // ===================== Shared: container row + detail + grouped list =====================
  function renderContainerRow(c, showParty){
    const s = state.suppliers.find(x=>x.id===c.supplierId);
    const status = computeContainerStatus(c);
    const w = containerWeightOf(c);
    const hisaabTag = c.hisaabSeq ? `<span class="hisaab-tag">Hisaab #${c.hisaabSeq}</span>` : `<span class="hisaab-tag none">No hisaab yet</span>`;
    const subBits = [];
    subBits.push('Weight: '+(w?numW(w):'—'));
    subBits.push('Cont. no.: '+(c.contNo?escapeHtml(c.contNo):'—'));
    if(c.material) subBits.push(escapeHtml(c.material));
    if(c.numContainers) subBits.push(c.numContainers+' cont');
    if(c.shippingLine) subBits.push(escapeHtml(c.shippingLine));
    subBits.push(fmtDate(c.date));
    return `<div class="row-item" data-open-container="${c.id}"><div><div class="name"><span class="seq">${escapeHtml(c.orderNo||('#'+c.seq))}</span> ${showParty && s?escapeHtml(s.name)+' ':''}${hisaabTag}</div><div class="sub">${subBits.join(' · ')}</div></div><div><span class="${statusBadgeClass(status)}">${status}</span></div></div>`;
  }

      html += `<div class="ledger-line"><div class="l-desc">Paid so far</div><div class="l-amt" style="width:auto;">${money(containerPaid(c))}</div></div>`;
      html += `<div class="ledger-line"><div class="l-desc"><b>Balance</b></div><div class="l-amt" style="width:auto;"><b>${money(containerBalance(c))}</b></div></div>`;

  function renderStatusChips(selected, attr){
    return '<div class="chip-row">' + STATUS_ORDER.map(st=>
      `<button type="button" class="chip ${selected.includes(st)?'chip-active':''}" data-${attr}="${escapeHtml(st)}">${st}</button>`

  // Open contracts are listed first (Payment Pending, Loaded, Booked); fully
  // settled "Arrived" containers sit in their own drop-down underneath.
  function containerMatchesSearch(c, q){
    const hay = [c.orderNo, c.price, c.netWeight, c.weight, c.contNo].map(v=>String(v==null?'':v).toLowerCase());
    return q.split(/\s+/).filter(Boolean).every(t=> hay.some(h=>h.includes(t)));
  }
  function renderContainerGroupedList(containers, filterStatuses, showParty, key, search){
    let filtered = containers;
    const q = (search||'').trim().toLowerCase();
    if(q) filtered = filtered.filter(c=>containerMatchesSearch(c,q));
    if(filterStatuses && filterStatuses.length){
      filtered = filtered.filter(c=> filterStatuses.includes(computeContainerStatus(c)));
    }
    if(filtered.length===0) return '<div class="empty">No containers match.</div>';
    const bySeq = (a,b)=>(Number(b.seq)||0)-(Number(a.seq)||0);
    const open = filtered.filter(c=>computeContainerStatus(c)!=='Arrived').sort((a,b)=>{
      const oa = STATUS_ORDER.indexOf(computeContainerStatus(a));
      const ob = STATUS_ORDER.indexOf(computeContainerStatus(b));
      return oa!==ob ? oa-ob : bySeq(a,b);
    });
    const arrived = filtered.filter(c=>computeContainerStatus(c)==='Arrived').sort(bySeq);
    const item = c=>{
      const s = state.suppliers.find(x=>x.id===c.supplierId);
      return renderContainerRow(c, showParty) + (state.openContainer===c.id ? renderContainerDetail(c, s) : '');
    };
    let html = '';
    if(open.length){
      html += `<div class="list-head">Open contracts <span class="count">${open.length}</span></div>`;
      html += '<div class="row-list">' + open.map(item).join('') + '</div>';
    } else if(!arrived.length){
      html += '<div class="empty">No open contracts.</div>';
    }
    if(arrived.length){
      const isOpen = state.arrivedOpen[key] || !!q || (filterStatuses||[]).includes('Arrived') || arrived.some(c=>c.id===state.openContainer);
      html += `<details class="arrived-group" data-arrived-key="${key}" ${isOpen?'open':''}><summary>Arrived containers <span class="count">${arrived.length}</span></summary>`;
      html += '<div class="row-list">' + arrived.map(item).join('') + '</div></details>';
    }
    return html;
  }

  function renderHisaabVoucher(h, s){
    let html = '<div class="voucher">';
    html += `<div class="voucher-head"><span>Hisaab #${h.seq}</span><span>${fmtDate(h.date)}</span></div>`;
    html += `<div class="voucher-row"><span class="vr-label">Party</span><span class="vr-val">${s?escapeHtml(s.name):'—'}</span></div>`;
    const vc = state.containers.find(x=>x.id===h.containerId);
    if(vc){
      html += `<div class="voucher-row"><span class="vr-label">Contract no.</span><span class="vr-val">${escapeHtml(vc.orderNo||('#'+vc.seq))}</span></div>`;
      html += `<div class="voucher-row"><span class="vr-label">Container no.</span><span class="vr-val">${escapeHtml(vc.contNo||'—')}</span></div>`;
    }
    if(h.isCombo && h.lines && h.lines.length){
      h.lines.forEach((l,i)=>{
        html += `<div class="voucher-row"><span class="vr-label">${escapeHtml(l.material||('Material '+(i+1)))}</span><span class="vr-val">${numW(l.weight)} × ${num(l.rate)} = ${num(l.amount)} ${h.rateCurrency||'USD'}</span></div>`;
      });
      html += `<div class="voucher-row"><span class="vr-label">Total weight</span><span class="vr-val">${numW(h.weight)}</span></div>`;
    } else {
      html += `<div class="voucher-row"><span class="vr-label">Weight</span><span class="vr-val">${numW(h.weight)}</span></div>`;
      html += `<div class="voucher-row"><span class="vr-label">Material</span><span class="vr-val">${escapeHtml(h.material||'—')}</span></div>`;
      html += `<div class="voucher-row"><span class="vr-label">Rate</span><span class="vr-val">${num(h.rate)} ${h.rateCurrency||'USD'}</span></div>`;
    }
    html += `<div class="voucher-row"><span class="vr-label">Amount</span><span class="vr-val">${num(h.grossAmount)} ${h.rateCurrency||'USD'}</span></div>`;
    html += `<div class="voucher-row"><span class="vr-label">Advance</span><span class="vr-val">${num(h.advance)}</span></div>`;
    if(Number(h.financeCost)>0){
      html += `<div class="voucher-row"><span class="vr-label">Finance cost</span><span class="vr-val">${num(h.financeCost)}</span></div>`;
    }
    html += `<div class="voucher-row"><span class="vr-label">Total</span><span class="vr-val">${num(h.total)}</span></div>`;
    html += `<div class="voucher-row"><span class="vr-label">INR rate</span><span class="vr-val">${num(h.inrRate)}</span></div>`;
    html += `<div class="voucher-row"><span class="vr-label">INR amount</span><span class="vr-val">${money(h.inrAmount)}</span></div>`;
    html += `<div class="voucher-row"><span class="vr-label">Bank charges</span><span class="vr-val">${money(h.bankCharges)}</span></div>`;
    html += `<div class="voucher-row net"><span class="vr-label">Net payable</span><span class="vr-val">${money(h.netPayable)}</span></div>`;
    if(h.containerId){
      const bal = containerBalance(state.containers.find(x=>x.id===h.containerId) || {});
      html += `<div class="voucher-note">Remaining on this container: ${money(bal)}</div>`;
    }
    const relatedClaims = state.claims.filter(cl=>cl.containerId===h.containerId && h.containerId);
    relatedClaims.forEach(cl=>{
      html += `<div class="voucher-note">Claim: ${money(cl.amount)} — ${escapeHtml(cl.note||'')}</div>`;
    });
    html += `<div class="quick-actions"><button class="ghost" data-delete-hisaab="${h.id}">Delete this hisaab</button></div>`;
    html += '</div>';
    return html;
  }

  // ===================== PARTY REPORT (printable) =====================
  function renderPartyReport(partyId){
    const s = state.suppliers.find(x=>x.id===partyId);
    const mine = state.containers.filter(c=>c.supplierId===partyId).sort((a,b)=>(Number(a.seq)||0)-(Number(b.seq)||0));
    const open = mine.filter(c=>computeContainerStatus(c)!=='Arrived');
    const arrived = mine.filter(c=>computeContainerStatus(c)==='Arrived');
    const openCons = open.reduce((t,c)=>t+(Number(c.numContainers)||1),0);
    const now = new Date();
    const stamp = now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) + ', ' + now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    const fd = d=> d ? new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-') : '-';
    const dash = v=> (v===undefined||v===null||v===''||v===0) ? '-' : v;
    const cell = v=> escapeHtml(String(dash(v)));
    const arrDate = c=>{ const h=containerHisaab(c); return c.arrivalDate || (h?h.date:''); };
    const priceOf = c=> c.price ? String(c.price)+(c.priceCurrency?' '+c.priceCurrency:'') : '';
    const row = (c,withMoney)=>{
      const h = containerHisaab(c);
      let r = `<tr><td>${cell(c.dealId)}</td><td><b>${escapeHtml(c.orderNo||('#'+c.seq))}</b></td><td>${cell(c.material)}</td><td class="n">${c.weight?numW(c.weight):'-'}</td><td class="n">${c.netWeight?numW(c.netWeight):'-'}</td><td class="n">${cell(c.numContainers)}</td><td>${cell(c.origin)}</td><td>${fd(arrDate(c))}</td><td>${cell(c.contNo)}</td><td>${cell(c.blNo)}</td><td>${cell(priceOf(c))}</td>`;
      if(withMoney) r += `<td>${h?'#'+h.seq:'-'}</td><td class="n">${h?money(containerNet(c)):'-'}</td><td class="n">${h?money(containerPaid(c)):'-'}</td><td class="n">${h?money(containerBalance(c)):'-'}</td>`;
      else r += `<td>${computeContainerStatus(c)}</td>`;
      return r + '</tr>';
    };
    const head1 = '<th>Deal ID</th><th>Contract no.</th><th>Material</th><th>Gross wt</th><th>Net wt</th><th>Cons</th><th>Origin</th><th>Arrival date</th><th>Container no.</th><th>BL no.</th><th>Price</th>';
    const table = (rows, extraHead, withMoney, emptyMsg)=> rows.length
      ? `<table class="rp-table"><thead><tr>${head1}${extraHead}</tr></thead><tbody>${rows.map(c=>row(c,withMoney)).join('')}</tbody></table>`
      : `<div class="rp-empty">${emptyMsg}</div>`;

    let h = '<div class="no-print rp-toolbar"><button class="ghost" data-report-back>← Back to party</button><button class="primary" data-report-print style="margin-top:0;">Print / Save as PDF</button></div>';
    h += '<div class="report">';
    h += `<div class="rp-band"><div class="rp-logo">NS</div><div class="rp-title">PARTY LEDGER</div><div class="rp-sub">PARTY: <b>${escapeHtml(s.name)}</b></div><div class="rp-open">OPEN CONTRACTS: ${openCons} CONS | ${open.length} DEALS</div><div class="rp-stamp">${stamp}</div></div><div class="rp-gold"></div>`;

    h += '<div class="rp-section">Open contracts</div>';
    h += table(open, '<th>Status</th>', false, 'No open contracts.');

    h += '<div class="rp-section">Arrived containers</div>';
    h += table(arrived, '<th>Hisaab</th><th>Net payable</th><th>Paid</th><th>Balance</th>', true, 'No arrived containers yet.');

    const hs = state.hisaabs.filter(x=>x.partyId===partyId).sort((a,b)=>(Number(a.seq)||0)-(Number(b.seq)||0));
    h += '<div class="rp-section">Hisaab accounts</div>';
    h += hs.length ? `<table class="rp-table"><thead><tr><th>Hisaab</th><th>Date</th><th>Contract no.</th><th>Container no.</th><th>Material</th><th>Weight</th><th>Amount</th><th>Advance</th><th>Finance cost</th><th>Total</th><th>INR rate</th><th>Bank charges</th><th>Net payable</th></tr></thead><tbody>${hs.map(x=>{ const c=state.containers.find(y=>y.id===x.containerId); return `<tr><td>#${x.seq}</td><td>${fd(x.date)}</td><td>${c?escapeHtml(c.orderNo||''):'-'}</td><td>${c?cell(c.contNo):'-'}</td><td>${cell(x.material)}</td><td class="n">${numW(x.weight)}</td><td class="n">${num(x.grossAmount)} ${x.rateCurrency||''}</td><td class="n">${num(x.advance)}</td><td class="n">${num(x.financeCost)}</td><td class="n">${num(x.total)}</td><td class="n">${num(x.inrRate)}</td><td class="n">${money(x.bankCharges)}</td><td class="n"><b>${money(x.netPayable)}</b></td></tr>`; }).join('')}</tbody></table>` : '<div class="rp-empty">No hisaab accounts yet.</div>';

    const pays = state.payments.filter(x=>x.partyId===partyId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    h += '<div class="rp-section">Payments made</div>';
    h += pays.length ? `<table class="rp-table"><thead><tr><th>Date</th><th>Contract no.</th><th>Container no.</th><th>Note</th><th>Amount</th></tr></thead><tbody>${pays.map(x=>{ const c=state.containers.find(y=>y.id===x.containerId); return `<tr><td>${fd(x.date)}</td><td>${c?escapeHtml(c.orderNo||''):'General'}</td><td>${c?cell(c.contNo):'-'}</td><td>${cell(x.note)}</td><td class="n">${money(x.amount)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="rp-empty">No payments recorded.</div>';

    const cls = state.claims.filter(x=>x.partyId===partyId).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    h += '<div class="rp-section">Claims (tracked separately)</div>';
    h += cls.length ? `<table class="rp-table"><thead><tr><th>Date</th><th>Contract no.</th><th>Container no.</th><th>Footnote</th><th>Claim amount</th></tr></thead><tbody>${cls.map(x=>{ const c=state.containers.find(y=>y.id===x.containerId); return `<tr><td>${fd(x.date)}</td><td>${c?escapeHtml(c.orderNo||''):'General'}</td><td>${c?cell(c.contNo):'-'}</td><td>${cell(x.note)}</td><td class="n">${money(x.amount)}</td></tr>`; }).join('')}</tbody></table>` : '<div class="rp-empty">No claims recorded.</div>';

    h += '<div class="rp-section">Account summary</div>';
    h += `<table class="rp-table rp-sum"><tbody><tr><td>Container balance (all hisaabs)</td><td class="n">${money(supplierContainerBalance(partyId))}</td></tr><tr><td>Advance given</td><td class="n">${money(supplierAdvanceBalance(partyId))}</td></tr><tr><td>Payments made</td><td class="n">${money(supplierPayments(partyId))}</td></tr><tr class="rp-total"><td>Net balance payable</td><td class="n">${money(supplierNetBalance(partyId))}</td></tr><tr><td>Claims (not included above)</td><td class="n">${money(supplierClaimBalance(partyId))}</td></tr></tbody></table>`;
    h += '</div>';
    return h;
  }

  // ===================== TAB: ALL OPEN CONTRACTS =====================
  function renderAllContractsTab(){
    let html = pageHeading('All Contracts', 'Every contract across all suppliers. Filter by status; settled containers are under Arrived.');
    html += `<div class="search-box"><input type="search" id="all-search" placeholder="Search by contract no., price, net weight or container no." value="${escapeHtml(state.allSearch)}" autocomplete="off"></div>`;
    html += renderStatusChips(state.allContractsFilter, 'all-status-filter');
    html += renderContainerGroupedList(state.containers, state.allContractsFilter, true, 'all', state.allSearch);
    return html;
  }

  // ===================== Live hisaab calc =====================
  function readLines(get){
    // get(name) -> raw value. Returns combo line items (only rows with a weight or rate).
    const lines = [];
    for(let i=0;i<5;i++){
      const material = (get('cm_'+i)||'').trim();
      const weight = Number(get('cw_'+i))||0, rate = Number(get('cr_'+i))||0;
      if(!material && !weight && !rate) continue;
      lines.push({ material, weight, rate, amount: weight*rate });
    }
    return lines;
  }
  function wireHisaabCalc(hf){
    const containerSel = hf.querySelector('#h-container');
    containerSel.addEventListener('change', ()=>{
      const cid = containerSel.value;
      const c = state.containers.find(x=>x.id===cid);
      if(c){
        hf.querySelector('#h-party').value = c.supplierId || '';
        hf.querySelector('#h-material').value = c.material || '';
        hf.querySelector('[name=date]').value = c.date || today();
        if(c.weight) hf.querySelector('#h-weight').value = c.weight;
        if(/combo/i.test(c.material||'')){ hf.querySelector('#h-combo').checked = true; }
        refresh();
      }
    });
    const refresh = ()=>{
      const isCombo = hf.querySelector('#h-combo').checked;
      hf.querySelector('#h-single-row').style.display = isCombo ? 'none' : '';
      hf.querySelector('#h-combo-block').style.display = isCombo ? '' : 'none';
      const wtInput = hf.querySelector('#h-weight');
      let weight, grossAmount;
      if(isCombo){
        const lines = readLines(n=> (hf.querySelector('[name='+n+']')||{}).value);
        weight = lines.reduce((a,l)=>a+l.weight,0);
        grossAmount = lines.reduce((a,l)=>a+l.amount,0);
        wtInput.value = weight ? String(Math.round(weight*1e6)/1e6) : '';
        wtInput.readOnly = true;
      } else {
        wtInput.readOnly = false;
        weight = Number(wtInput.value)||0;
        grossAmount = weight*(Number(hf.querySelector('#h-rate').value)||0);
      }
      const advance = Number(hf.querySelector('#h-advance').value)||0;
      const financeCost = Number(hf.querySelector('#h-finance').value)||0;
      const inrRate = Number(hf.querySelector('#h-inrrate').value)||0;
      const bankCharges = Number(hf.querySelector('#h-bank').value)||0;
      const total = grossAmount - advance + financeCost;
      const inrAmount = total*inrRate;
      const netPayable = inrAmount - bankCharges;
      hf.querySelector('#h-amount-display').value = num(grossAmount);
      hf.querySelector('#h-total-display').value = num(total);
      hf.querySelector('#h-inramount-display').value = money(inrAmount);
      hf.querySelector('#h-net-display').textContent = money(netPayable);
    };
    hf.addEventListener('input', refresh);
    hf.addEventListener('change', refresh);
    refresh();
  }

  function bindEvents(){
    const refreshBtn = document.getElementById('refresh-btn');
    if(refreshBtn) refreshBtn.addEventListener('click', ()=>{ refreshBtn.textContent='Refreshing…'; loadAll(); });

    app.querySelectorAll('details[data-arrived-key]').forEach(d=> d.addEventListener('toggle', ()=>{ state.arrivedOpen[d.dataset.arrivedKey] = d.open; }));
    const sb = document.getElementById('all-search');
    if(sb){
      sb.addEventListener('input', ()=>{
        state.allSearch = sb.value; render();
        const n = document.getElementById('all-search'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
      });
    }
    app.querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=> setTab(b.dataset.tab)));
    app.querySelectorAll('[data-open-container]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.dataset.openContainer; state.openContainer = state.openContainer===id?null:id; render();
    }));
    app.querySelectorAll('[data-open-hisaab]').forEach(el=> el.addEventListener('click', ()=>{
      const id = el.dataset.openHisaab; state.openHisaab = state.openHisaab===id?null:id; render();
    }));
    app.querySelectorAll('[data-open-party-page]').forEach(el=> el.addEventListener('click', ()=>{
      state.activePartyId = el.dataset.openPartyPage; state.partySubTab='containers'; state.openContainer=null; state.openHisaab=null; render();
    }));
    app.querySelectorAll('[data-open-report]').forEach(el=> el.addEventListener('click', ()=>{ state.reportPartyId = el.dataset.openReport; render(); window.scrollTo(0,0); }));
    app.querySelectorAll('[data-back-to-parties]').forEach(el=> el.addEventListener('click', ()=>{
      state.activePartyId = null; render();
    }));
    app.querySelectorAll('[data-party-subtab]').forEach(el=> el.addEventListener('click', ()=>{
      state.partySubTab = el.dataset.partySubtab; state.openContainer=null; state.openHisaab=null; render();
    }));
    app.querySelectorAll('[data-party-status-filter]').forEach(el=> el.addEventListener('click', ()=>{
      const st = el.dataset.partyStatusFilter;
      const i = state.partyContainerFilter.indexOf(st);
      if(i>=0) state.partyContainerFilter.splice(i,1); else state.partyContainerFilter.push(st);
      render();
    }));
    app.querySelectorAll('[data-all-status-filter]').forEach(el=> el.addEventListener('click', ()=>{
      const st = el.dataset.allStatusFilter;
      const i = state.allContractsFilter.indexOf(st);
      if(i>=0) state.allContractsFilter.splice(i,1); else state.allContractsFilter.push(st);
      render();
    }));
    app.querySelectorAll('[data-goto-tab]').forEach(el=> el.addEventListener('click', ()=>{
      presetContainer = el.dataset.presetContainer || null;
      state.tab = el.dataset.gotoTab;
      state.openContainer=null; state.openHisaab=null;
      render();
      if(presetContainer){
        const sel = document.getElementById('h-container');
        if(sel){ sel.value = presetContainer; sel.dispatchEvent(new Event('change')); }
      }
    }));
    app.querySelectorAll('[data-edit-container]').forEach(el=> el.addEventListener('click', ()=>{
      state.editingContainerId = el.dataset.editContainer; state.openContainer=null; state.tab='containers'; render();
    }));
    app.querySelectorAll('[data-toggle-duty]').forEach(el=> el.addEventListener('change', (e)=>{
      e.stopPropagation(); toggleContainerFlag(el.dataset.toggleDuty, 'dutyPaid');
    }));
    app.querySelectorAll('[data-toggle-shipping]').forEach(el=> el.addEventListener('change', (e)=>{
      e.stopPropagation(); toggleContainerFlag(el.dataset.toggleShipping, 'shippingPaid');
    }));

    app.querySelectorAll('[data-delete-container]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this container? This cannot be undone.')) return;
      el.disabled = true;
      try{ state.openContainer=null; await deleteContainer(el.dataset.deleteContainer); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-hisaab]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this hisaab? This cannot be undone.')) return;
      el.disabled = true;
      try{ state.openHisaab=null; await deleteHisaab(el.dataset.deleteHisaab); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-payment]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this payment? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deletePayment(el.dataset.deletePayment); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));
    app.querySelectorAll('[data-delete-claim]').forEach(el=> el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this claim? This cannot be undone.')) return;
      el.disabled = true;
      try{ await deleteClaim(el.dataset.deleteClaim); render(); }
      catch(err){ console.error(err); el.disabled=false; alert('Could not delete — try again.'); }
    }));

    const cf = document.getElementById('container-form');
    if(cf){
      const cancelBtn = document.getElementById('cancel-edit-container');
      if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingContainerId=null; render(); });
      cf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(cf);
        const editingId = state.editingContainerId;
        const btn = cf.querySelector('button.primary'); btn.disabled = true; btn.textContent='Saving…';
        let data;
        if(editingId){
          const existing = state.containers.find(c=>c.id===editingId);
          data = Object.assign({}, existing, {
            supplierId: fd.get('supplierId')||'', date: fd.get('date')||today(),
            material: (fd.get('material')||'').trim(), numContainers: Number(fd.get('numContainers'))||0,
            price: (fd.get('price')||'').trim(), priceCurrency: fd.get('priceCurrency')||'', contNo: (fd.get('contNo')||'').trim(),
            shippingLine: (fd.get('shippingLine')||'').trim(), weight: Number(fd.get('weight'))||0,
            netWeight: Number(fd.get('netWeight'))||0, origin: (fd.get('origin')||'').trim(), blNo: (fd.get('blNo')||'').trim(),
            arrivalDate: fd.get('arrivalDate')||'', dealId: (fd.get('dealId')||'').trim(),
            notes: (fd.get('notes')||'').trim()
          });
        } else {
          const seq = nextContainerSeq();
          const date = fd.get('date')||today();
          data = {
            id: uid(), seq, orderNo: generateOrderNo(seq, date), supplierId: fd.get('supplierId')||'',
            date, material: (fd.get('material')||'').trim(), numContainers: Number(fd.get('numContainers'))||0,
            price: (fd.get('price')||'').trim(), priceCurrency: fd.get('priceCurrency')||'', contNo: (fd.get('contNo')||'').trim(),
            shippingLine: (fd.get('shippingLine')||'').trim(), weight: Number(fd.get('weight'))||0,
            netWeight: Number(fd.get('netWeight'))||0, origin: (fd.get('origin')||'').trim(), blNo: (fd.get('blNo')||'').trim(),
            arrivalDate: fd.get('arrivalDate')||'', dealId: (fd.get('dealId')||'').trim(),
            notes: (fd.get('notes')||'').trim(), dutyPaid:false, shippingPaid:false, hisaabSeq:null
          };
        }
        try{ await saveContainer(data); state.editingContainerId=null; render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent=editingId?'Update container':'Save container'; alert('Could not save — try again.'); }
      });
    }

    const hf = document.getElementById('hisaab-form');
    if(hf){
      wireHisaabCalc(hf);
      if(presetContainer){ const sel = hf.querySelector('#h-container'); sel.value = presetContainer; sel.dispatchEvent(new Event('change')); }
      hf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(hf);
        const isCombo = fd.get('isCombo')==='on';
        const comboLines = isCombo ? readLines(n=>fd.get(n)) : [];
        let weight, rate, grossAmount, materialName;
        if(isCombo){
          weight = comboLines.reduce((a,l)=>a+l.weight,0);
          grossAmount = comboLines.reduce((a,l)=>a+l.amount,0);
          rate = weight ? grossAmount/weight : 0;
          materialName = comboLines.map(l=>l.material).filter(Boolean).join(' + ') || 'COMBO';
        } else {
          weight = Number(fd.get('weight'))||0; rate = Number(fd.get('rate'))||0;
          grossAmount = weight*rate; materialName = (fd.get('material')||'').trim();
        }
        const advance = Number(fd.get('advance'))||0;
        const financeCost = Number(fd.get('financeCost'))||0;
        const inrRate = Number(fd.get('inrRate'))||0, bankCharges = Number(fd.get('bankCharges'))||0;
        const total = grossAmount-advance+financeCost, inrAmount = total*inrRate;
        const netPayable = inrAmount - bankCharges;
        const data = {
          id: uid(), seq: nextHisaabSeq(), containerId: fd.get('containerId')||null, partyId: fd.get('partyId'),
          date: fd.get('date')||today(), weight, material: materialName, rate,
          isCombo, lines: comboLines,
          rateCurrency: fd.get('rateCurrency')||'USD', grossAmount, advance, financeCost, total, inrRate, inrAmount, bankCharges, netPayable
        };
        if(!data.partyId){ alert('Please select a party.'); return; }
        const btn = hf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        try{ presetContainer=null; await saveHisaab(data); render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save hisaab'; alert('Could not save — try again.'); }
      });
    }

    const pf = document.getElementById('payment-form');
    if(pf){
      const payContainerSel = pf.querySelector('#pay-container');
      payContainerSel.addEventListener('change', ()=>{
        const c = state.containers.find(x=>x.id===payContainerSel.value);
        const hint = pf.querySelector('#pay-hint');
        hint.innerHTML = '';
        if(c){
          pf.querySelector('#pay-party').value = c.supplierId || '';
          const bal = containerBalance(c);
          if(bal===null){ hint.textContent = 'No hisaab for this container yet — it will still count once a hisaab is added.'; }
          else {
            hint.innerHTML = `Balance on ${escapeHtml(c.orderNo||('#'+c.seq))}: <b>${money(bal)}</b> `;
            if(bal>0){
              const b = document.createElement('button'); b.type='button'; b.className='link-btn'; b.textContent='Fill full balance';
              b.addEventListener('click', ()=>{ pf.querySelector('#pay-amount').value = Math.round(bal*100)/100; });
              hint.appendChild(b);
            }
          }
        }
      });
      pf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(pf);
        const data = { id: uid(), containerId: fd.get('containerId')||null, partyId: fd.get('partyId'), amount: Number(fd.get('amount'))||0, date: fd.get('date')||today(), note: (fd.get('note')||'').trim() };
        if(!data.partyId){ alert('Please select a party.'); return; }
        const btn = pf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        try{ await savePayment(data); render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save payment'; alert('Could not save — try again.'); }
      });
    }

    const clf = document.getElementById('claim-form');
    if(clf){
      const clContainerSel = clf.querySelector('#cl-container');
      clContainerSel.addEventListener('change', ()=>{
        const c = state.containers.find(x=>x.id===clContainerSel.value);
        if(c) clf.querySelector('#cl-party').value = c.supplierId || '';
      });
      clf.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(clf);
        const data = { id: uid(), containerId: fd.get('containerId')||null, partyId: fd.get('partyId'), amount: Number(fd.get('amount'))||0, date: fd.get('date')||today(), note: (fd.get('note')||'').trim() };
        if(!data.partyId){ alert('Please select a party.'); return; }
        const btn = clf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
        try{ await saveClaim(data); render(); }
        catch(err){ console.error(err); btn.disabled=false; btn.textContent='Save claim'; alert('Could not save — try again.'); }
      });
    }

    const sf = document.getElementById('supplier-form');
    if(sf) sf.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const fd = new FormData(sf);
      const data = { id: uid(), name: fd.get('name').trim(), phone: fd.get('phone').trim(), createdAt: today() };
      if(!data.name) return;
      const btn = sf.querySelector('button'); btn.disabled = true; btn.textContent='Saving…';
      try{ await saveSupplier(data); render(); }
      catch(err){ console.error(err); btn.disabled=false; btn.textContent='Add supplier'; alert('Could not save — try again.'); }
    });
  }

  setTimeout(()=>{ if(!state.loaded){ state.loaded = true; state.loadError = 'Timed out reaching shared storage — check your internet connection and try Refresh.'; render(); } }, 8000);

  loadAll();
})();
</script>
